name: One-time paid report QA
on:
  workflow_dispatch:
    inputs:
      paid_qa_confirmation:
        description: 'Paid API calls (up to 7). Type RUN_ONE_PAID_SAMPLE to authorize this run.'
        required: true
        type: string
permissions:
  contents: read
jobs:
  report-qa:
    # Never execute the outdated default branch's report generator.
    # The current verified QA code lives only on the named feature branch.
    if: ${{ github.ref_name == 'fix-paid-qa-fact-bindings-20261014' && inputs.paid_qa_confirmation == 'RUN_ONE_PAID_SAMPLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
      REPORT_QA_OUTPUT: ${{ github.workspace }}/private-qa-report.json
      REPORT_QA_CONFIRM: ${{ inputs.paid_qa_confirmation }}
    steps:
      - name: Verify operator authorization and approved code branch
        shell: bash
        run: |
          test "$REPORT_QA_CONFIRM" = "RUN_ONE_PAID_SAMPLE" || { echo "Paid QA was not explicitly authorized"; exit 1; }
          test "$GITHUB_REF_NAME" = "fix-paid-qa-fact-bindings-20261014" || { echo "Paid QA must use the approved tested branch"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify configuration without exposing secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY secret"; exit 1; }
          test -n "$REPORT_MODEL" || { echo "Missing REPORT_MODEL variable"; exit 1; }
      - name: Generate exactly one QA sample (up to 7 model calls)
        run: node run-paid-report-qa.js
      - name: Upload private QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-report-qa
          path: private-qa-report.json
          if-no-files-found: ignore
          retention-days: 1
