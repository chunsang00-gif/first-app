name: One-time paid report QA
on:
  workflow_dispatch:
    inputs:
      paid_qa_confirmation:
        description: 'ONE new first-chapter model call. Type RUN_ONE_PAID_SAMPLE to authorize this run.'
        required: true
        type: string
permissions:
  contents: read
jobs:
  report-qa:
    if: ${{ github.ref_name == 'fix-paid-qa-fact-bindings-20261014' && inputs.paid_qa_confirmation == 'RUN_ONE_PAID_SAMPLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
      REPORT_QA_OUTPUT: ${{ github.workspace }}/private-qa-first-chapter.json
      REPORT_QA_CONFIRM: ${{ inputs.paid_qa_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify complete offline suite BEFORE paid QA
        run: npm test && npm run smoke
      - name: Enforce one-call manual approval without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$REPORT_QA_CONFIRM" = "RUN_ONE_PAID_SAMPLE" || { echo "No explicit one-call approval"; exit 1; }
          test "$GITHUB_REF_NAME" = "fix-paid-qa-fact-bindings-20261014" || { echo "Wrong branch"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY secret"; exit 1; }
          test -n "$REPORT_MODEL" || { echo "Missing REPORT_MODEL variable"; exit 1; }
      - name: Generate revised first chapter ONLY (maximum 1 new model call)
        run: node run-paid-first-chapter-qa.js
      - name: Upload private first-chapter evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-first-chapter-qa
          path: |
            private-qa-first-chapter.json
            private-qa-first-chapter-attempt.json
            private-qa-first-chapter-provider-calls.json
            private-qa-first-chapter-validated-first-chapter.json
          if-no-files-found: ignore
          retention-days: 1
