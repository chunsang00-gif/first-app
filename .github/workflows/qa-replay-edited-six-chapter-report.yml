name: Replay edits with the archived six-chapter report
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-replay-edited-six-chapter-report.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1568536021d44cffc2b4ffd1952822419a189f07
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 45973922274
          name: paid-report-annual-summary-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Recheck final quality without calling the provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/review-private"' EXIT
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/review-private"
          unset OPENAI_API_KEY REPORT_MODEL_URL REPORT_MODEL_KEY
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), assert=require('node:assert/strict');
          const root=path.join(process.env.RUNNER_TEMP,'review-private');
          function read(suffix){
           const file=path.join(root,'private-qa-first-chapter'+suffix+'.json');
           return fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):null;
          }
          const saved=read('');
          assert.equal(saved.sourceRun,'45896281549');
          const {report,coverage}=saved.result;
          assert.equal(report.sections.length,6);
          assert(report.cover&&report.finalJudgment);
          const packet=require('./report-facts-node').build({
           ...require('./qa-launch-g1-money-preflight').INPUT,birthDate:'1982-10-15',
           readerDecision:'기존 일을 유지할지 새로운 기술을 배울지 고민 중입니다.'
          },2027);
          assert.equal(packet.status,'ready');
          global.fetch=async()=>{throw Error('OFFLINE_ONLY');};
          function inspect(candidate){
           const qa=require('./report-quality-node').validate(candidate,packet);
           const result=require('./report-release-gate').finalize({report:candidate,qa,packet,coverage});
           return {pass:result.pass,errors:result.errors,technical:result.releaseGate.technicalChecks};
          }
          const mbtiText="이 사례가 입력한 ISFP 선호는 확인된 사례와 사람에게 미칠 영향을 먼저 살피는 쪽입니다. 한편 사주에서는 태어난 달의 겉에서 함께 쓸 자원의 몫을, 안에서 배움과 도움을 읽습니다. 새 일을 함께 맡을 때, 해본 일과 비슷해 보여도 장비를 배울 사람과 시간을 확보하지 못했다면 맡은 몫을 감당할 준비는 부족하다는 풀이입니다.";
          const finalText="기존 일을 이어간다면 바꿀 절차 하나와 개선 여부를 판정할 기준을 정합니다. 새 기술을 배운다면 도움받을 곳과 혼자 끝낼 결과물을 먼저 정합니다. 첫 선택은 바꾼 방식이 검증될 때, 두 번째 선택은 배운 내용을 혼자 써볼 수 있을 때 다음 판단으로 넘어갈 근거가 생깁니다.";
          const batches=read('-validated-first-chapter').batches.filter(b=>!b.ids.includes('year_2027'));
          assert.equal(batches.flatMap(b=>b.ids).length,5);
          const mbti=batches.flatMap(b=>b.sections).find(x=>x.id==='mbti_contradiction');
          mbti.body[0]=mbtiText;
          const calls=read('-provider-calls').calls;
          assert.equal(calls.length,2);
          const seen=[];
          const input={...require('./qa-launch-g1-money-preflight').INPUT,
           birthDate:'1982-10-15',readerDecision:'기존 일을 유지할지 새로운 기술을 배울지 고민 중입니다.'};
          async function main(){
           const original=inspect(report);
           let outcome;
           try{
            const result=await require('./report-server-contract').generate(input,async prompt=>{
             const call=calls[seen.length];
             assert.deepEqual(prompt.requestedSections,call.sections);
             assert.equal(prompt.stage,call.stage);
             seen.push(prompt.stage);
             const response=call.response;
             assert.equal(response.status,'completed');
             const text=response.output_text||response.output.flatMap(item=>item.content||[])
              .filter(item=>item.type==='output_text').map(item=>item.text).join('');
             const value=require('./report-response-decoder').decode(JSON.parse(text),prompt);
             if(prompt.stage==='synthesis'){
              value.finalJudgment.body[0]=finalText;
              value.finalJudgment.closingQuestion='기존 일을 계속할지는 개선 여부로, 새 기술을 더 배울지는 혼자 결과물을 완성할 수 있는지로 판단합니다.';
             }
             return value;
            },()=>{},()=>{},batches,{paidWholeNatalContext:true});
            outcome={status:result.status,errors:result.qa.errors,
             actualChapters:result.report.sections.length,
             annualRepeated:result.report.sections.find(s=>s.id==='year_2027').body.some(x=>x.includes('겉글자에서도 반복'))};
           }catch(error){outcome={status:'blocked',reason:error.message};}
           console.log('COMBINED_REPORT_REPLAY='+JSON.stringify({original,outcome,seen,modelCalls:0,saleApproved:false}));
          }
          main().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
