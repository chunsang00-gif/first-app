name: One-time private reading of already-paid first chapter (no model calls)
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-sealed-reader-review-once-20261019.yml]
permissions:
  contents: read
  actions: read
jobs:
  seal-archived-visible-first-chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Download existing encrypted output only; zero provider calls
        uses: actions/download-artifact@v4
        with:
          name: premium-first-chapter-qa-encrypted
          repository: chunsang00-gif/first-app
          run-id: 39172323501
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/encrypted
      - name: Recover existing content privately with already-configured secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/encrypted/premium-first-chapter-qa.enc" "$RUNNER_TEMP/qa-private"
      - name: Seal selected existing customer-facing text to ephemeral review key
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/qa-private" "$RUNNER_TEMP/encrypted"' EXIT
          node - "$RUNNER_TEMP/qa-private/private-qa-first-chapter-provider-calls.json" <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');
          const record=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(record.calls?.length!==1||record.calls[0]?.request?.stage!=='body')throw Error('INVALID_ARCHIVED_SCOPE');
          if(JSON.stringify(Object.keys(record.calls[0]?.request?.task?.chapters||{}))!=='["saju_core"]')
           throw Error('INVALID_ARCHIVED_SECTION');
          const core=record.calls[0]?.response?.chapters?.saju_core;
          if(!core||!core.paragraphs||typeof core.keyJudgment!=='string')throw Error('MISSING_PAID_ORIGINAL');
          const facts=require('./report-facts-node').build(record.sample,2027);
          if(facts.status!=='ready')throw Error('INVALID_ORIGINAL_FACTS');
          const pair=require('./report-chart-contrast').build(facts)?.monthTenGodContext;
          const content={
           archivedRun:39172323501,
           title:core.title,
           keyJudgment:core.keyJudgment,
           paragraphs:Object.fromEntries(Object.entries(core.paragraphs).filter(([,v])=>v).map(([k,v])=>
            [k,{label:v.label,text:v.text,refs:v.basis?.refs||[],interpretation:v.basis?.interpretation||'',condition:v.basis?.condition||'',limit:v.basis?.limit||''}])),
           categories:[pair?.monthStem?.tenGod,pair?.monthMainHidden?.tenGod],
           sameClassification:pair?.sameClassification
          };
          const pub=crypto.createPublicKey({key:Buffer.from('','base64'),format:'der',type:'spki'});
          const k=crypto.randomBytes(32),nonce=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv('aes-256-gcm',k,nonce);
          const message=Buffer.from(JSON.stringify(content),'utf8');
          const ct=Buffer.concat([cipher.update(message),cipher.final()]);
          const envelope={version:'offline-review-once-v1',archivedRun:39172323501,
           key:crypto.publicEncrypt({key:pub,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},k).toString('base64'),
           nonce:nonce.toString('base64'),tag:cipher.getAuthTag().toString('base64'),
           ct:ct.toString('base64')};
          console.log('SEALED_ARCHIVED_REVIEW='+Buffer.from(JSON.stringify(envelope),'utf8').toString('base64'));
          console.log('PRIVATE_REVIEW_META='+JSON.stringify({paragraphCount:Object.keys(content.paragraphs).length,
           apiCallsNow:0,plaintextPrinted:false,privateKeyInRunner:false}));
          NODE
