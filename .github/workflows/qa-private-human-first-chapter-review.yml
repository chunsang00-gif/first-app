name: Read old paid first chapter for user editorial review (no model calls)
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-private-human-first-chapter-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  encrypted-editorial-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REPORT_MODEL_URL: ''
      REPORT_QA_CONFIRM: ''
      REVIEW_PUBLIC_KEY_B64: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original paid QA encrypted artifact, NOT a new AI request
        uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 42369675176
          name: qa-current-normal-core-20261107-encrypted
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Re-encrypt first chapter to short-lived reviewer public key; log only ciphertext
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/verified"' EXIT
          test -z "$REPORT_QA_CONFIRM"
          test -z "$REPORT_MODEL_URL"
          node report-qa-secure-archive.js decrypt \
            "$RUNNER_TEMP/source/premium-first-chapter-qa.enc" \
            "$RUNNER_TEMP/verified"
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const record=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,
           'verified/private-qa-first-chapter-provider-calls.json'),'utf8'));
          if(record?.kind!=='private-first-chapter-original-provider-response'||
             record?.providerCalls!==1||
             record?.requestHash!=='dd5c1a38775aaab052363a41c2ddab7ea7336d8db456140442bc0bb78eda6170'||
             !record?.response?.chapters?.saju_core||
             record?.model!=='gpt-4.1')
           throw Error('ARCHIVE_BILLABLE_ORIGINAL_IDENTITY_MISMATCH');
          const chapter=record.response.chapters.saju_core;
          const plain=Buffer.from(JSON.stringify({runId:42369675176,
           firstChapter:chapter}),'utf8');
          if(plain.length>45000)throw Error('SINGLE_CHAPTER_TOO_LARGE');
          const key=crypto.randomBytes(32),nonce=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv('aes-256-gcm',key,nonce);
          const ciphertext=Buffer.concat([cipher.update(plain),cipher.final()]);
          const tag=cipher.getAuthTag();
          const publicKey=Buffer.from(process.env.REVIEW_PUBLIC_KEY_B64,'base64').toString('utf8');
          const sealedKey=crypto.publicEncrypt({key:publicKey,
           padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          const packet={kind:'one-time-first-chapter-editorial-cipher-v1',
           sealedKey:sealedKey.toString('base64'),nonce:nonce.toString('base64'),
           tag:tag.toString('base64'),data:ciphertext.toString('base64')};
          console.log('PRIVATE_EDITORIAL_CIPHER='+Buffer.from(JSON.stringify(packet),'utf8').toString('base64'));
          console.log('ORIGINAL_FIRST_CHAPTER_SECURELY_TRANSFERRED_NO_PAID_CALL');
          NODE
