# Existing PAID Terra run only. No generation or network provider call.
name: Terra existing first chapter — sealed editorial review (NO API)
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: ['.github/workflows/qa-terra-real-original-editorial-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  extract-existing-original:
    if: ${{ github.ref_name == 'fix-paid-qa-fact-bindings-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      REPORT_MODEL_URL: ''
      REPORT_MODEL: ''
      REPORT_QA_CONFIRM: ''
      REVIEW_PUBLIC_KEY_B64: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f80355a748f0cc3719f94a2541b20b96dff6c7a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline dependencies without install scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Download ALREADY GENERATED encrypted Terra first chapter
        uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 44319550676
          name: terra-first-chapter-qa-encrypted
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terra-source
      - name: Compare original with exact free chart and seal private review
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/terra-source" "$RUNNER_TEMP/terra-private"' EXIT
          test -z "$REPORT_MODEL"
          test -z "$REPORT_QA_CONFIRM"
          test -z "$REPORT_MODEL_URL"
          test -s "$RUNNER_TEMP/terra-source/premium-first-chapter-qa.enc"
          node report-qa-secure-archive.js decrypt \
            "$RUNNER_TEMP/terra-source/premium-first-chapter-qa.enc" \
            "$RUNNER_TEMP/terra-private"
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs'),path=require('node:path');
          const crypto=require('node:crypto'),zlib=require('node:zlib');
          const dir=path.join(process.env.RUNNER_TEMP,'terra-private');
          const reviewer=require('./qa-terra-first-chapter-human-review');
          const values=reviewer.readPrivate(dir);
          const report=reviewer.build(values);
          if(report.sourceRun!==44319550676||
             report.additionalModelCalls!==0||
             report.actualPaidProviderCallsInArchive!==1||
             report.releaseVerdict!=='not-approved')
             throw Error('SEALED_TERRA_REVIEW_IDENTITY_OR_SALE_GATE');
          const data={kind:'private-sealed-terra-first-chapter-v1',
            sourceRun:44319550676,
            sourceCommit:'1f80355a748f0cc3719f94a2541b20b96dff6c7a',
            original:values.raw.response.chapters.saju_core,
            receipt:values.raw.usage||null,
            review:report,providerCallsTotal:1,newProviderCalls:0,
            customerSaleApproved:false,releaseVerdict:'not-approved'};
          const plain=zlib.gzipSync(Buffer.from(JSON.stringify(data),'utf8'));
          if(plain.length>90000)throw Error('SEALED_REVIEW_PACKET_TOO_LARGE');
          const key=crypto.randomBytes(32),nonce=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv('aes-256-gcm',key,nonce);
          const ciphertext=Buffer.concat([cipher.update(plain),cipher.final()]);
          const publicKey=Buffer.from(process.env.REVIEW_PUBLIC_KEY_B64,'base64').toString('utf8');
          const sealedKey=crypto.publicEncrypt({key:publicKey,
            padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          const packet={kind:'sealed-terra-editorial-transfer-v1',gzip:true,
            sealedKey:sealedKey.toString('base64'),
            nonce:nonce.toString('base64'),
            tag:cipher.getAuthTag().toString('base64'),
            data:ciphertext.toString('base64')};
          console.log('TERRA_REAL_REVIEW_CIPHER='+Buffer.from(JSON.stringify(packet)).toString('base64'));
          console.log('TERRA_EXISTING_ORIGINAL_SEALED_NO_PAID_API_REQUEST');
          NODE
