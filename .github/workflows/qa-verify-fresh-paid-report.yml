name: Check the fresh paid report plan offline
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-verify-fresh-paid-report.yml]
permissions:
  contents: read
  actions: read
jobs:
  only-approved-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: verify-fresh-paid-report
      cancel-in-progress: false
    env:
      NODE_ENV: test
      REPORT_MODEL: gpt-6-luna
      REPORT_MODEL_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check resume and continuation limits without a provider
        run: node qa-resume-paid-report-once.js --fresh-preflight
