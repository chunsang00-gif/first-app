name: Verify the archived relationship recovery offline
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-verify-annual-summary-prefix.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: verify-annual-summary-prefix
      cancel-in-progress: false
    env:
      NODE_ENV: test
      REPORT_MODEL: gpt-6-luna
      REPORT_MODEL_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check resume and continuation limits without a provider
        run: node qa-resume-paid-report-once.js --annual-preflight
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 45896281549
          name: launch-report-revised-first-chapter-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/paid-resume-source
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 45953625555
          name: paid-report-resume-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/paid-continuation-source
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 45954272626
          name: paid-report-finish-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/paid-relationship-source
      - name: Restore five archived chapters with network disabled
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/paid-resume-source" "$RUNNER_TEMP/paid-resume-private" "$RUNNER_TEMP/paid-continuation-source" "$RUNNER_TEMP/paid-continuation-private" "$RUNNER_TEMP/paid-relationship-source" "$RUNNER_TEMP/paid-relationship-private"' EXIT
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/paid-resume-source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/paid-resume-private"
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/paid-continuation-source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/paid-continuation-private"
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/paid-relationship-source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/paid-relationship-private"
          unset OPENAI_API_KEY GITHUB_TOKEN
          node qa-resume-paid-report-once.js --verify-annual-prefix "$RUNNER_TEMP/paid-resume-private" "$RUNNER_TEMP/paid-continuation-private" "$RUNNER_TEMP/paid-relationship-private"
