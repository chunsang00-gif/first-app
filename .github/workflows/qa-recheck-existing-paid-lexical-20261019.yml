name: One-shot replay of archived paid first-chapter meaning recognition (NO model calls)
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-recheck-existing-paid-lexical-20261019.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit-old-first-chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REPORT_MODEL_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Download only already-paid encrypted first-chapter artifact
        uses: actions/download-artifact@v4
        with:
          name: premium-first-chapter-qa-encrypted
          repository: chunsang00-gif/first-app
          run-id: 39172323501
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/encrypted
      - name: Decrypt in ephemeral private directory without provider requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node report-qa-secure-archive.js decrypt \
            "$RUNNER_TEMP/encrypted/premium-first-chapter-qa.enc" \
            "$RUNNER_TEMP/private"
      - name: Re-evaluate actual paid first-chapter prose with current free source checks
        env:
          OPENAI_API_KEY: ''
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/private" "$RUNNER_TEMP/encrypted"' EXIT
          node - "$RUNNER_TEMP/private/private-qa-first-chapter-provider-calls.json" <<'NODE'
          'use strict';
          global.fetch=async()=>{throw Error('NO_NETWORK_ALLOWED_IN_ARCHIVED_REVIEW')};
          const fs=require('node:fs');
          const old=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(old.calls?.length!==1||old.calls[0].request?.stage!=='body')throw Error('WRONG_PAID_SOURCE');
          const core=old.calls[0].response?.chapters?.saju_core;
          if(!core?.paragraphs)throw Error('ARCHIVED_PAID_FIRST_CHAPTER_MISSING');
          const facts=require('./report-facts-node').build(old.sample,2027);
          if(facts.status!=='ready')throw Error('ORIGINAL_CALCULATION_UNAVAILABLE');
          const rows=Object.entries(core.paragraphs).filter(([,x])=>x?.text);
          const draft={sections:[{
           id:'saju_core',title:core.title,keyJudgment:core.keyJudgment,
           bodyTopics:rows.map(([k])=>k),bodyLabels:rows.map(([,x])=>x.label),
           body:rows.map(([,x])=>x.text),evidence:[]
          }]};
          const codes=require('./report-grounding-review').inspect(draft,facts).blockingErrors;
          const missing=codes.includes('saju_core:month-pair-meaning-missing-from-main-paragraph');
          const categories=require('./report-chart-contrast').build(facts).monthTenGodContext;
          console.log('REAL_PAID_ARCHIVED_LEXICAL_RECHECK='+JSON.stringify({
           paidRun:39172323501,apiCallsNow:0,previousOmissionFalsePositiveRemaining:missing,
           categoryPair:[categories.monthStem.tenGod,categories.monthMainHidden.tenGod],
           blockingCodes:codes,humanEditorialVerdict:'NOT_APPROVED'
          }));
          if(missing)throw Error('ARCHIVED_PAID_KOREAN_MEANING_STILL_UNRECOGNIZED');
          NODE
