name: One-time zero-cost QA replay
on:
  push:
    branches: [fix-saju-tone-20261010]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.ref == 'refs/heads/fix-saju-tone-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Download private archived QA responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          gh run download 38509495415 --repo "$GITHUB_REPOSITORY" --name premium-report-qa --dir "$RUNNER_TEMP/archive"
          test -s "$RUNNER_TEMP/archive/private-qa-report-raw-calls.json"
      - name: Verify rejected report is caught earlier by latest validator without API calls
        shell: bash
        run: |
          set +e
          node replay-paid-report-qa.js "$RUNNER_TEMP/archive/private-qa-report-raw-calls.json" > "$RUNNER_TEMP/replay.json"
          code=$?
          set -e
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1])); console.log('Archived provider calls:',r.archived,'; replayed calls:',r.consumed,'; replay status:',r.status); if(r.status==='ready'||r.consumed>6||r.archived!==7)process.exit(1)" "$RUNNER_TEMP/replay.json"
          test "$code" -eq 2
