name: Private reading of already generated compact G1 text
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-compact-g1-private-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1346363ac7d4b78908508fcca3a7d95672b2dd5
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 45625708281
          name: launch-g1-compact-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Seal only three existing synthetic manuscript fields to ephemeral reviewer key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/review-private"' EXIT
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/review-private"
          unset OPENAI_API_KEY REPORT_MODEL_URL REPORT_MODEL_KEY
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'review-private/private-qa-first-chapter-provider-calls.json'),'utf8'));
          assert.equal(r.kind,'compact-original-response');
          assert.equal(crypto.createHash('sha256').update(JSON.stringify(r.request),'utf8').digest('hex'),'10d3c90640cfbe015916dd09e5f6a65a193272f5acd812cae546fd93bc79118e');
          assert.equal(r.response.status,'completed');
          const t=JSON.parse(r.response.output.filter(x=>x.type==='message').flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join(''));
          assert.deepEqual(Object.keys(t).sort(),['firstChoice','relationship','secondChoice']);
          assert(Object.values(t).every(x=>typeof x==='string'&&x.length<=180));
          const k=crypto.randomBytes(32),iv=crypto.randomBytes(12),c=crypto.createCipheriv('aes-256-gcm',k,iv);
          const data=Buffer.concat([c.update(JSON.stringify(t),'utf8'),c.final()]);
          const pk=crypto.createPublicKey({key:Buffer.from('','base64'),format:'der',type:'spki'});
          const sealed=crypto.publicEncrypt({key:pk,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},k);
          const packet={key:sealed.toString('base64'),iv:iv.toString('base64'),tag:c.getAuthTag().toString('base64'),data:data.toString('base64')};
          console.log('COMPACT_REVIEW_CIPHER='+Buffer.from(JSON.stringify(packet)).toString('base64'));
          NODE
