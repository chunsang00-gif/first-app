name: Finish the fresh saju report from its verified four chapters
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [qa-approvals/finish-fresh-saju-once.json]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: finish-fresh-saju-once
      cancel-in-progress: false
    env:
      NODE_ENV: test
      REPORT_MODEL: gpt-6-luna
      REPORT_MODEL_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 46154455313
          name: continued-fresh-saju-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/first-response
      - name: Continue from the verified first response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/first-response" "$RUNNER_TEMP/first-private"' EXIT
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/first-response/premium-first-chapter-qa.enc" "$RUNNER_TEMP/first-private"
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),c=require('node:crypto'),z=require('node:zlib');
          const {execFileSync}=require('node:child_process'),path=require('node:path');
          const repo='chunsang00-gif/first-app',workflow='.github/workflows/qa-finish-fresh-saju-once.yml',markerPath='qa-approvals/finish-fresh-saju-once.json';
          const env=process.env,native=global.fetch;
          const times=['08:20'],stagePlan=[
           ['relationship'],['year_2027'],['year_2027_career'],[]
          ];
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const rows=[];
          const input={calendar:'solar',birthDate:'1990-02-15',gender:'male',mbti:'ISFP',
           readerDecision:'기존 일을 유지할지 새로운 기술을 배울지 고민 중입니다.'};
          const b=x=>Buffer.from(x,'base64');
          const oldError=console.error;
          async function main(){
           assert.equal(env.GITHUB_REPOSITORY,repo);
           assert.equal(env.GITHUB_REF,'refs/heads/fix-paid-qa-fact-bindings-20261014');
           assert.equal(env.GITHUB_EVENT_NAME,'push');
           assert.equal(env.GITHUB_RUN_ATTEMPT,'1');
           assert.equal(env.GITHUB_WORKFLOW_REF,repo+'/'+workflow+'@'+env.GITHUB_REF);
           assert.equal(git('rev-parse','HEAD'),env.GITHUB_SHA);
           assert.equal(git('diff','--name-only','HEAD^','HEAD'),markerPath);
           assert(env.OPENAI_API_KEY?.length>=32);
           const marker=JSON.parse(fs.readFileSync(markerPath,'utf8'));
           assert.deepEqual(Object.keys(marker).sort(),['kind','maxCalls','parent','sourceRun'].sort());
           assert.equal(marker.kind,'finish-fresh-saju-v1');
           assert.equal(marker.parent,git('rev-parse','HEAD^'));
           assert.equal(marker.sourceRun,46154455313);
           assert.equal(marker.maxCalls,4);
           await require('./qa-launch-whole-chart-first-chapter-once').history(env,native,{workflow});
           const prior=JSON.parse(fs.readFileSync(path.join(env.RUNNER_TEMP,'first-private','private-qa-first-chapter.json')));
           assert.deepEqual(prior.map(row=>row.birthTime),times);
           const first=prior[0];
           assert.deepEqual(first.accepted,['saju_core','mbti_contradiction']);
           assert.equal(first.calls.length,2);
           assert.deepEqual(first.calls[1].sections,['money','career']);
           assert.equal(first.latestResponse.status,'completed');
           const output=first.latestResponse.output_text||first.latestResponse.output
            .flatMap(item=>item.content||[]).filter(item=>item.type==='output_text').map(item=>item.text).join('');
           const rehearsal=[];
           const boundary=Error('RELATIONSHIP_NEXT');
           const {decode}=require('./report-response-decoder');
           await assert.rejects(require('./report-server-contract').generate({...input,birthTime:first.birthTime},async prompt=>{
            if(prompt.requestedSections[0]!=='money')throw boundary;
            return decode(JSON.parse(output),prompt);
           },()=>{},batch=>rehearsal.push(batch),first.checkpoints,{paidWholeNatalContext:true}),e=>e===boundary);
           const saved=[{birthTime:first.birthTime,checkpoints:[...first.checkpoints,...rehearsal]}];
           assert.deepEqual(saved.map(x=>x.birthTime),times);
           const precharge=require('./report-paid-core-precharge-value');
           for(const row of saved){
            assert.deepEqual(row.checkpoints.flatMap(batch=>batch.ids),['saju_core','mbti_contradiction','money','career']);
            assert.equal(precharge.inspect({...input,birthTime:row.birthTime}).eligible,true);
           }
           const {generate}=require('./report-server-contract'), {callOpenAI}=require('./server');
           console.error=()=>{};
           for(const {birthTime,checkpoints} of saved){
            const row={birthTime,accepted:['saju_core','mbti_contradiction','money','career'],checkpoints:[...checkpoints],calls:[]};
            rows.push(row);
            let active;
            global.fetch=async(url,options)=>{
             assert(active&&!active.sent);
             assert.equal(url,'https://api.openai.com/v1/responses');
             assert.equal(options.method,'POST');
             assert(Buffer.byteLength(options.body)<225000);
             const wire=JSON.parse(options.body);
             assert.equal(wire.model,'gpt-6-luna');
             assert.equal(wire.store,false);
             assert(wire.max_output_tokens<=(active.sections.includes('saju_core')?18000:12000));
             active.sent=true;
             row.calls.push({stage:active.stage,sections:active.sections});
             const summary=row.calls.at(-1);
             const response=await native(url,options);
             const data=await response.clone().json().catch(()=>null);
             summary.httpStatus=response.status;
             summary.providerStatus=data?.status;
             summary.inputTokens=data?.usage?.input_tokens;
             summary.outputTokens=data?.usage?.output_tokens;
             if(data)row.latestResponse=data;
             return response;
            };
            try{
             row.result=await generate({...input,birthTime},async prompt=>{
              const expected=stagePlan[row.calls.length];
              assert(expected,'unplanned model call');
              assert.deepEqual(prompt.requestedSections,expected);
              assert.equal(prompt.stage,expected.length?'body':'synthesis');
              active={stage:prompt.stage,sections:expected,sent:false};
              try{return await callOpenAI(prompt);}finally{active=null;}
             },()=>{},batch=>{row.accepted.push(...batch.ids);row.checkpoints.push(batch);},checkpoints,{paidWholeNatalContext:true});
            }catch(error){row.stopReason=error.message;}
            finally{global.fetch=native;}
           }
          }
          main().catch(()=>{console.log('PAIR_RESUME_BLOCKED');process.exitCode=1;}).finally(async()=>{
           console.error=oldError;
           const row=rows[0];
           const state=row?.result?.status==='ready'?'success':'failure';
           const description=row?'Accepted '+row.accepted.length+' chapters; '+row.calls.length+' calls; '+(row.result?.status||'stopped'):'Stopped before model call';
           const status=await native('https://api.github.com/repos/'+repo+'/statuses/'+env.GITHUB_SHA,{
            method:'POST',headers:{authorization:'Bearer '+env.GITHUB_TOKEN,
             accept:'application/vnd.github+json','content-type':'application/json'},
            body:JSON.stringify({state,description,context:'saju-qa/fresh-finish',
             target_url:'https://github.com/'+repo+'/actions/runs/'+env.GITHUB_RUN_ID})
           });
           if(!status.ok)console.log('SAJU_STATUS_POST_FAILED');
           if(!rows.length)return;
           console.log('PAIR_RESUME_STATUS='+JSON.stringify(rows.map(x=>({birthTime:x.birthTime,
            status:x.result?.status||'stopped',accepted:x.accepted,calls:x.calls}))));
           fs.writeFileSync('private-qa-first-chapter.json',JSON.stringify(rows),{mode:0o600});
           require('./report-qa-secure-archive').encrypt();
           fs.unlinkSync('private-qa-first-chapter.json');
           const key=c.randomBytes(32),iv=c.randomBytes(12);
           const cipher=c.createCipheriv('aes-256-gcm',key,iv);
           const payload=Buffer.concat([cipher.update(z.gzipSync(JSON.stringify(rows))),cipher.final()]);
           const pk=c.createPublicKey({key:b(''),format:'der',type:'spki'});
           const wrapped=c.publicEncrypt({key:pk,padding:c.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
           const pack=Object.fromEntries(Object.entries({wrapped,iv,tag:cipher.getAuthTag(),payload}).map(([n,v])=>[n,v.toString('base64')]));
           const parts=Buffer.from(JSON.stringify(pack)).toString('base64').match(/.{1,1500}/g);
           parts.forEach((s,i)=>console.log('PAIR_RESUME_CIPHER_'+i+'_'+parts.length+'='+s));
           if(rows.some(x=>x.result?.status!=='ready'))process.exitCode=2;
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finished-fresh-saju-evidence
          path: premium-first-chapter-qa.enc
          if-no-files-found: ignore
          retention-days: 30
