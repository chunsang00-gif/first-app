name: Offline replay with month and hour readings
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [.github/workflows/qa-replay-paid-first-chapter-with-month.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 34137f8f9cf8b07fbbf9e636db6d250e14989663
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 45896281549
          name: launch-report-revised-first-chapter-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Replay the sealed synthetic manuscript through the current decoder
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/review-private"' EXIT
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/review-private"
          unset OPENAI_API_KEY REPORT_MODEL_URL REPORT_MODEL_KEY
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const root = path.join(process.env.RUNNER_TEMP,'review-private');
          function read(name) {
           const file = path.join(root,'private-qa-first-chapter'+name+'.json');
           return fs.existsSync(file) ? JSON.parse(fs.readFileSync(file,'utf8')) : null;
          }
          const attempt = read('-attempt');
          assert.equal(attempt.runId,'45896281549');
          const result = read('');
          const retained = read('-provider-calls');
          const checkpoint = read('-validated-first-chapter');
          const review = {result,checkpoint,manuscript:null};
          if (retained) {
           assert.equal(retained.kind,'whole-chart-original-response');
           const hash = crypto.createHash('sha256').update(JSON.stringify(retained.request)).digest('hex');
           assert.equal(hash,'c9bb5d4b2c5f00ba17af339fd15f4abec3fb2e30e7b2a46008a328e8b0e2cf14');
           const r = retained.response;
           review.httpStatus = retained.httpStatus;
           review.status = r?.status || null;
           review.usage = r?.usage || null;
           review.reason = r?.incomplete_details?.reason || r?.error?.code || null;
           const body = r?.output_text || r?.output?.flatMap(x=>x.type==='message'?x.content||[]:[]).filter(x=>x.type==='output_text').map(x=>x.text).join('') || '';
           if (body.length <= 24000 && body) {
            try {review.manuscript = JSON.parse(body).chapters?.saju_core || null;}
            catch {review.parseStatus = 'incomplete-or-invalid-json';}
           }
          }
          async function replay() {
          assert.equal(review.status,'completed');
          assert.equal(review.result.calls,1);
          const archived = retained.response;
          const text = archived.output_text || archived.output.flatMap(x=>x.type==='message'?x.content||[]:[]).filter(x=>x.type==='output_text').map(x=>x.text).join('');
          const raw = JSON.parse(text);
          const input={...require('./qa-launch-g1-money-preflight').INPUT,birthDate:'1982-10-15',readerDecision:'기존 일을 유지할지 새로운 기술을 배울지 고민 중입니다.'};
          const stop=Error('STOP_AFTER_VALIDATED_CHECKPOINT');
          const replayResult={status:'started',readerChapter:null,next:null,network:0};
          review.replay=replayResult;
          global.fetch=async()=>{replayResult.network++;throw Error('OFFLINE_NETWORK_BLOCKED');};
          const diagnostics=[];
          console.error=(...args)=>diagnostics.push(args);
          try {
           await require('./report-server-contract').generate(input,async prompt=>{
            if(replayResult.readerChapter){replayResult.next=prompt.requestedSections;throw stop;}
            assert.deepEqual(prompt.requestedSections,['saju_core']);
            return require('./report-response-decoder').decode(raw,prompt);
           },()=>{},batch=>{
            assert.deepEqual(batch.ids,['saju_core']);
            replayResult.readerChapter=batch.sections[0];
           },[],{paidWholeNatalContext:true});
           throw Error('UNEXPECTED_COMPLETE_REPORT');
          } catch(error) {
           replayResult.status=error===stop?'first-chapter-validated':'rejected';
           if(error!==stop){replayResult.reason=error.message;replayResult.diagnostics=diagnostics;}
          }
          assert.equal(replayResult.network,0);
          }
          replay().then(()=>{
          const session = crypto.randomBytes(32), iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm',session,iv);
          const payload = Buffer.concat([cipher.update(JSON.stringify(review),'utf8'),cipher.final()]);
          const pk = crypto.createPublicKey({key:Buffer.from('','base64'),format:'der',type:'spki'});
          const wrapped = crypto.publicEncrypt({key:pk,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},session);
          const packet = Object.fromEntries(Object.entries({wrapped,iv,tag:cipher.getAuthTag(),payload}).map(([name,value])=>[name,value.toString('base64')]));
          console.log('PAID_REPORT_REVIEW_CIPHER='+Buffer.from(JSON.stringify(packet)).toString('base64'));
          }).catch(()=>{process.exitCode=1;});
          NODE
