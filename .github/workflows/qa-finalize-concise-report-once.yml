name: Finalize the concise paid report once
on:
  push:
    branches: [fix-paid-qa-fact-bindings-20261014]
    paths: [qa-approvals/finalize-concise-report-once.json]
permissions:
  contents: read
  actions: read
jobs:
  only-approved-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: finalize-concise-report-once
      cancel-in-progress: false
    env:
      NODE_ENV: test
      REPORT_MODEL: gpt-6-luna
      REPORT_MODEL_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check resume and continuation limits without a provider
        run: node qa-resume-paid-report-once.js --finalize-concise-preflight
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 46101450865
          name: concise-paid-report-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 46106375971
          name: concise-paid-report-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/continued
      - uses: actions/download-artifact@v4
        with:
          repository: chunsang00-gif/first-app
          run-id: 46109450697
          name: completed-concise-report-encrypted-evidence
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/relationship
      - name: Finish 2027 and synthesis from five verified chapters
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/checkpoint" "$RUNNER_TEMP/continued" "$RUNNER_TEMP/continued-checkpoint" "$RUNNER_TEMP/relationship" "$RUNNER_TEMP/relation-checkpoint"' EXIT
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/source/premium-first-chapter-qa.enc" "$RUNNER_TEMP/checkpoint"
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/continued/premium-first-chapter-qa.enc" "$RUNNER_TEMP/continued-checkpoint"
          node report-qa-secure-archive.js decrypt "$RUNNER_TEMP/relationship/premium-first-chapter-qa.enc" "$RUNNER_TEMP/relation-checkpoint"
          node qa-resume-paid-report-once.js --finalize-concise "$RUNNER_TEMP/checkpoint" "$RUNNER_TEMP/continued-checkpoint" "$RUNNER_TEMP/relation-checkpoint"
      - name: Seal review evidence including failed responses
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node report-qa-secure-archive.js encrypt
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalized-concise-report-encrypted-evidence
          path: premium-first-chapter-qa.enc
          if-no-files-found: ignore
          retention-days: 30
      - name: Seal a private review copy for the reader
        if: always() && hashFiles('private-qa-first-chapter.json') != ''
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
          const zlib=require('node:zlib'), assert=require('node:assert/strict');
          const root=process.cwd();
          function read(suffix){
           const file=path.join(root,'private-qa-first-chapter'+suffix+'.json');
           return fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):null;
          }
          const result=read(''), archive=read('-provider-calls'), batches=read('-validated-first-chapter');
          assert.equal(result.sourceRun,'46101450865');
          if(archive)assert.equal(archive.sourceRun,result.sourceRun);
          if(batches)assert.equal(batches.sourceRun,result.sourceRun);
          const calls=(archive?.calls||[]).map(({stage,sections,httpStatus,response})=>({
           stage,sections,httpStatus,status:response?.status||null,usage:response?.usage||null,
           reason:response?.incomplete_details?.reason||response?.error?.code||null
          }));
          console.log('CONTINUED_QA_SUMMARY='+JSON.stringify({
           status:result.result?.status||result.status,dispatched:result.dispatched,stage:result.stage,calls,
           errorCategory:/^AI report service (returned|missing|error|invalid)[a-zA-Z0-9 :_()/-]{0,140}$/.test(result.reason||'')?result.reason:null
          }));
          const last=archive?.calls.at(-1)?.response;
          const output=last?.output_text||last?.output?.flatMap(item=>item.content||[])
           .filter(item=>item.type==='output_text').map(item=>item.text).join('')||null;
          const evidence={result,batches,calls,rejectedOutput:result.result?.report?null:output};
          const session=crypto.randomBytes(32),iv=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv('aes-256-gcm',session,iv);
          const packed=zlib.gzipSync(JSON.stringify(evidence));
          const payload=Buffer.concat([cipher.update(packed),cipher.final()]);
          const pk=crypto.createPublicKey({key:Buffer.from('','base64'),format:'der',type:'spki'});
          const wrapped=crypto.publicEncrypt({key:pk,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},session);
          const packet=Object.fromEntries(Object.entries({wrapped,iv,tag:cipher.getAuthTag(),payload}).map(([n,b])=>[n,b.toString('base64')]));
          const encoded=Buffer.from(JSON.stringify(packet)).toString('base64');
          const chunks=encoded.match(/.{1,1500}/g);
          chunks.forEach((chunk,i)=>console.log('WHOLE_REPORT_CIPHER_'+i+'_'+chunks.length+'='+chunk));
          NODE
