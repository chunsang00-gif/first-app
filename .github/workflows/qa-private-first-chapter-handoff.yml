name: Private offline first-chapter human review handoff
on:
  push:
    branches:
      - fix-paid-qa-fact-bindings-20261014
    paths:
      - .github/workflows/qa-private-first-chapter-handoff.yml
      - qa-ephemeral-review-export.js
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  existing-first-chapter:
    if: github.ref_name == 'fix-paid-qa-fact-bindings-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only the already generated first-chapter archive
        uses: actions/download-artifact@v4
        with:
          name: premium-first-chapter-qa-encrypted
          repository: chunsang00-gif/first-app
          run-id: 38912939787
          github-token: ${{ github.token }}
      - name: Verify and encrypt minimal review contents
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QA_EPHEMERAL_REVIEW_PUBLIC_KEY: MCowBQYDK2VuAyEAKLC0yX3tdHZEGx6fnxXKoEsXuVlF/C/8aBFwoRjvKkA=
        run: |
          set -euo pipefail
          umask 077
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          node report-qa-secure-archive.js decrypt "$GITHUB_WORKSPACE/premium-first-chapter-qa.enc" "$d"
          node qa-ephemeral-review-export.js "$d/private-qa-first-chapter-validated-first-chapter.json"
