name: Replay most recent paid response with zero provider calls
on:
  push:
    branches:
      - fix-paid-qa-fact-bindings-20261014
    paths:
      - .github/workflows/offline-paid-qa-replay.yml
permissions:
  contents: read
  actions: read
jobs:
  replay-latest-first-paid-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Neither a real API key nor a paid model provider is configured here.
      OPENAI_API_KEY: ''
      REPORT_MODEL_URL: ''
      # Only used to validate the ORIGINAL paid fingerprint and exact model.
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
      QA_PROVIDER_ARCHIVE: ${{ github.workspace }}/.private-replay/private-qa-report-provider-calls.json
      QA_RECOVERY_CHECKPOINT: ${{ github.workspace }}/.private-replay/recovered-validated-batch.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Retrieve first paid response without revealing its contents
        uses: actions/download-artifact@v4
        with:
          name: premium-report-qa
          run-id: 38833494716
          github-token: ${{ github.token }}
          path: .private-replay
      - name: Offline replay exact failed paid root citations
        shell: bash
        run: |
          set +e
          node report-offline-replay.js .private-replay/private-qa-report-provider-calls.json > .private-replay/diagnosis.json
          code=$?
          set -e
          node - <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync('.private-replay/diagnosis.json','utf8'));
          const safe={
            archiveKind:result.archiveKind,
            status:result.status,
            firstFailure:result.firstFailure||null,
            failureLayer:result.failureLayer||null,
            stoppedAt:result.stoppedAt,
            archivedContractChanged:result.archivedContractChanged,
            archivedCallsConsumed:result.archivedCallsConsumed,
            providerRequests:result.providerRequests,
            releaseVerdict:result.releaseVerdict
          };
          console.log('Replay of actual 2026-10-16 first paid call:',JSON.stringify(safe));
          if(result.providerRequests!==0||result.archiveKind!=='provider'||
             result.archivedCallsConsumed!==1||result.releaseVerdict!=='not-assessed')
            throw Error('Private archive replay security contract failed');
          if(result.firstFailure!=='ARCHIVE_EXHAUSTED'){
            console.error('First paid batch remains blocked after code changes. Do not issue another paid QA request.');
            process.exit(1);
          }
          console.log('PASS: the actual first paid batch cleared report validation; no second archived call exists. Zero paid requests.');
          NODE
      - name: Recover paid first batch as an opt-in private checkpoint, without billing
        run: node recover-paid-report-qa-checkpoint.js
      - name: Preserve verified recovery checkpoint for explicitly approved continuation
        uses: actions/upload-artifact@v4
        with:
          name: first-batch-verified-checkpoint
          path: .private-replay/recovered-validated-batch.json
          if-no-files-found: error
          retention-days: 1
