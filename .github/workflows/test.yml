name: saju-mbti-tests
on:
  push:
    branches: [saju-mbti-app, fix-saju-tone-20261010, fix-paid-qa-fact-bindings-20261014]
  pull_request:
    branches: [saju-mbti-app]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node character-assets-test.js
      - run: npm test
      - run: npm run smoke
      # CI success on a feature branch only means its code passed tests.
      # Feature branches are never assumed to be deployed on Render.
      - name: Explain feature-branch deployment boundary
        if: github.ref != 'refs/heads/saju-mbti-app'
        run: echo "NOT DEPLOYED - feature branch tests do not verify or trigger Render deployment"
      - name: Verify production revision (operating branch only, informational)
        if: github.ref == 'refs/heads/saju-mbti-app'
        continue-on-error: true
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          (async()=>{
            const target='https://first-app-n4ue.onrender.com/api/health';
            try {
              const response=await fetch(target,{signal:AbortSignal.timeout(12000)});
              if(!response.ok)throw Error('health HTTP '+response.status);
              const health=await response.json();
              console.log('Render currently deployed:',health.deployCommit||'unknown');
              console.log('Production branch commit:',process.env.EXPECTED_DEPLOY_SHA);
              if(!health.deployCommit||health.deployCommit!==process.env.EXPECTED_DEPLOY_SHA)
                throw Error('NOT DEPLOYED: branch revision differs from running service');
              console.log('PASS production revision matches operating branch');
            }catch(e){
              console.error('DEPLOYMENT NOT VERIFIED:',String(e.message||e));
              process.exitCode=1;
            }
          })();
          NODE

  recover-paid-natal-once:
    # ONE specific push, feature branch only. No model invocation ever.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix-paid-qa-fact-bindings-20261014' && github.event.head_commit.message == 'ci(qa): one-time recover encrypted natal-depth manuscript without provider' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download EXISTING paid response ONLY (no new provider call)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-original"
          gh run download 39753663547 --name premium-natal-depth-qa-encrypted --dir "$RUNNER_TEMP/qa-original"
          test -s "$RUNNER_TEMP/qa-original/premium-first-chapter-qa.enc"
      - name: Decrypt ONLY in runner memory/disk and reseal for offline reading
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_QA_ARCHIVE_KEY: ${{ secrets.REPORT_QA_ARCHIVE_KEY }}
          QA_EXISTING_ARCHIVE: ${{ runner.temp }}/qa-original/premium-first-chapter-qa.enc
          QA_REVIEW_PUBLIC_KEY: ${{ github.workspace }}/qa-natal-ephemeral-review-public.pem
          QA_SEALED_OUTPUT: ${{ runner.temp }}/sealed-review.json
        run: node qa-recover-paid-natal-20261022.js
      - name: Upload ONLY separately sealed review packet
        uses: actions/upload-artifact@v4
        with:
          name: premium-natal-depth-sealed-human-review
          path: ${{ runner.temp }}/sealed-review.json
          if-no-files-found: error
          retention-days: 1
