name: saju-mbti-tests
on:
  push:
    branches: [saju-mbti-app, fix-saju-tone-20261010, fix-paid-qa-fact-bindings-20261014]
  pull_request:
    branches: [saju-mbti-app]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Launch G1 — print ONE eligible first-chapter approval packet (NO AI, NO PAYMENT)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-launch-g1-money-preflight.js
      - name: Proofread actual FREE templates and 3 manually revised first-chapter drafts (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-free-reading-language-tests.js
      - run: node character-assets-test.js
      - run: npm test
      - name: Verify REAL web server serves every app entry script and denies private files (LOCAL HTTP)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-public-entry-scripts-tests.js
      - name: Verify current-work/learning context is shown ONLY for the matching question (NO API, NO PAYMENT)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-buyer-work-skill-scope-tests.js
      - name: Ensure a free HTTP calculation receipt cannot be reused after work or skill input changes (LOCAL HTTP)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-free-buyer-context-receipt-http-tests.js
      - name: Verify same-chart FREE text is visible to paid first-chapter writer (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-free-baseline-tests.js
      - name: Resolve MONTH-vs-HOUR policy conflict in real paid first-chapter request (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-hour-policy-conflict-tests.js
      - name: Check ACTUAL source-bound paid first-chapter writer for skill, money and pressure (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-domain-boundary-tests.js
      - name: Reject FREE year-hour category reuse before paid order (NO API, NO MERCHANT)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-free-natal-novelty-tests.js
      - name: Reject generic buyer advice unlinked to verified hour role BEFORE next paid call (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-hour-choice-meaning-tests.js
      - name: Verify real paid one-concern skill, money and pressure reader value BEFORE extra paid call (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-single-concern-value-tests.js
      - name: Refuse unreviewable buyer questions BEFORE reserving money or calling paid AI (REAL chart, NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-precharge-reader-feasibility-tests.js
      - name: Measure how many synthetic buyers can technically get a NEW first paid chapter (NO API/CHARGE)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-adaptive-first-chapter-technical-reach.js
      - name: Pilot distinct birth-DAY hidden category vs FREE and hour-only paid precharge (NO API / PAY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-day-hidden-versus-free-pilot.js
      - name: Cross-check day-hidden candidate against same-chart MONTH repeats and natal relations (NO API / PAY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-day-hidden-cross-pillar-value-tests.js
      - name: Print synthetic day-hidden FREE comparison inputs for authored first-chapter editorial work (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-day-hidden-editorial-fixtures.js
      - name: Produce actual same-chart FREE vs 3 offline editorial first-chapter candidate readings (NO AI / NO PAY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: |
          node qa-first-chapter-cross-domain-editorial-pack.js
          node qa-first-chapter-cross-domain-editorial-pack.js --markdown > "$RUNNER_TEMP/paid-first-chapter-three-domain-review.md"
          test -s "$RUNNER_TEMP/paid-first-chapter-three-domain-review.md"
      - name: Attach reviewable human-authored manuscript, not actual AI output
        uses: actions/upload-artifact@v4
        with:
          name: first-chapter-three-domain-manual-editorial-pack
          path: ${{ runner.temp }}/paid-first-chapter-three-domain-review.md
          retention-days: 14
      - name: Compare same-chart free reader with manual paid-first-chapter example (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: |
          node qa-first-chapter-value-audit-tests.js
          node qa-first-chapter-value-audit.js > "$RUNNER_TEMP/first-chapter-public-synthetic-value-audit.md"
          test -s "$RUNNER_TEMP/first-chapter-public-synthetic-value-audit.md"
      - run: npm run smoke
      - name: Verify additional normal-paid monthly evidence without API charges
        run: node report-paid-core-month-nonmain-exposure-tests.js
      - name: Verify paid delivery failure is visible without a new charge or refund promise
        run: node report-paid-delivery-state-tests.js
      - name: Check a DIFFERENT evidence-based first-chapter reading order without paid calls
        run: node report-core-month-exposure-reading-order-tests.js
      - name: Reject retired Luna first-chapter archive identity and repeated hour-role paid preflight (NO API)
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-luna-private-first-chapter-review-tests.js
      - name: Verify customer-choice comparison report shows precise weekly-hour, extended-period and budget alternatives (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-work-skill-decision-comparison-tests.js
      - name: Verify privacy-minimized local numeric report, partial cases and copy-only safety (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-work58-private-export-tests.js
      - name: Verify standalone offline mobile trial embeds CURRENT product modules and runs the synthetic user journey (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-workbook-mobile-offline-trial-tests.js
      - name: Attach standalone FREE offline HTML for hands-on mobile usability trial (NOT A DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: work57-single-file-offline-mobile-trial
          path: workbook-mobile-offline-trial.html
          retention-days: 14
      - name: Exercise REAL Step-01 workbook browser preview in JS VM and compare Node calculation (NO HTTP / AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-work-skill-decision-workbook-ui-tests.js
      - name: Validate customer-reported work-vs-learning workbook with real hour/budget math and missing-data guard (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-work-skill-decision-workbook-tests.js
      - name: Compare same-reader HOUR-to-month versus HOUR-to-day BRANCH relations for non-generic product method (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-hour-branch-relational-editorial-pilot.js
      - name: Audit real HOUR paid source for duplicate year/day natal hidden roles before spending (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-paid-hour-cross-pillar-value-tests.js
      - name: Export nine distinct synthetic first-chapter source cases beside REAL FREE reading (NO API/CHARGE)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: |
          node qa-work61-nine-case-human-review-packet.js --markdown > "${RUNNER_TEMP}/work61-nine-case-human-review.md"
          test -s "${RUNNER_TEMP}/work61-nine-case-human-review.md"
          echo 'PASS work61: nine source-only cases exported for HUMAN method / buyer-value review, not sale'
      - name: Archive work61 nine-case synthetic FREE-vs-candidate review packet
        uses: actions/upload-artifact@v4
        with:
          name: work61-nine-case-human-review-no-paid-calls
          path: ${{ runner.temp }}/work61-nine-case-human-review.md
          if-no-files-found: error
          retention-days: 14
      - name: Build S02 synthetic expert review HTML for a real independent method decision (LOCAL ONLY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: |
          node report-s02-expert-handoff.js --html > "${RUNNER_TEMP}/work65-s02-independent-expert-review.html"
          test -s "${RUNNER_TEMP}/work65-s02-independent-expert-review.html"
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const subject=require('./report-s02-expert-handoff');
          const packet=subject.source(),html=subject.html();
          assert.equal(packet.caseId,'S02');
          assert.equal(packet.chart,'壬戌 / 丁未 / 己亥 / 乙丑');
          // Work67: real textual match of day+hour DOES NOT make the
          // independently cited 卯/申-month outcomes applicable to 未-month S02.
          assert.deepEqual(packet.textScope.caseExplicitMonths,['卯','申']);
          assert.equal(packet.textScope.actualCalculatedMonth,'未');
          assert.equal(packet.textScope.specificMonthRuleMatched,false);
          assert.equal(packet.textScope.dayHourRuleProfessionallyApplied,false);
          assert.equal(packet.textScope.branchRelationAndMonthPriorityProfessionallyResolved,false);
          assert.equal(packet.textScope.personalWealthPredictionVerified,false);
          assert(html.includes('이 사례의 계산된 출생월:'));
          assert(html.includes('원문에서 확인한 내용과 아직 판단할 수 없는 부분'));
          assert(html.includes('일부 온라인 전사본에서 己/已/巳가 혼용되는 대목'));
          assert.equal(html.includes('출생월: 卯월'),false);
          assert.equal(packet.licensedForPaidGeneration,false);
          assert.equal(packet.approvedForSale,false);
          assert.equal(packet.checkoutEnabled,false);
          assert.equal(packet.paidProviderCalls,0);
          assert.equal(packet.questions.length,4);
          for(const c of packet.freeCards)assert(html.includes(c.text));
          assert(html.includes("connect-src &#39;none&#39;"));
          assert(!html.includes('api/checkout/start'));
          assert(!html.includes('OPENAI_API_KEY'));
          assert(!html.includes('<script src='));
          assert(!html.includes('fetch('));
          console.log('PASS S02 expert HTML grounded in ACTUAL free cards; no API, approval or checkout');
          NODE
      - name: Attach S02 synthetic expert review HTML for PRIVATE human handoff
        uses: actions/upload-artifact@v4
        with:
          name: work65-s02-independent-expert-review-no-paid-calls
          path: ${{ runner.temp }}/work65-s02-independent-expert-review.html
          if-no-files-found: error
          retention-days: 14
      # Work70: Give the owner the FULL existing original editorial texts.
      # Do not summarize, regenerate, reword or pretend these are paid API outputs.
      - name: Preserve complete nine-chapter original and later six-chapter revision (zero AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: |
          mkdir -p "${RUNNER_TEMP}/work70-complete-original-editorial-drafts"
          original="qa/full-report-offline-reader-manuscript-1982-1420-20261107.md"
          revision="qa/adaptive-v1-six-chapter-source-specific-reader-draft-20261116.md"
          for file in "$original" "$revision"; do
            test -s "$file"
            cp "$file" "${RUNNER_TEMP}/work70-complete-original-editorial-drafts/"
            cmp "$file" "${RUNNER_TEMP}/work70-complete-original-editorial-drafts/$(basename "$file")"
          done
          test "$(grep -c '^## [1-9]\.' "$original")" -eq 9
          test "$(grep -c '^## [1-6]장\.' "$revision")" -eq 6
          grep -q '판매 불가' "$original"
          grep -q '실제 유료 AI 생성본 아님' "$revision"
          echo 'PASS original 9 chapters + revised 6 chapters, byte-for-byte unchanged; paid calls=0'
      - name: Attach BOTH complete existing editorial manuscripts, unabridged and not-for-sale
        uses: actions/upload-artifact@v4
        with:
          name: work70-complete-original-editorial-nine-and-six-chapters-NOT-PAID
          path: ${{ runner.temp }}/work70-complete-original-editorial-drafts/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Freeze the exact new Luna first-chapter QA consent packet with NO provider transport
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
        run: node qa-luna-first-chapter-approval-packet-tests.js
      - name: Reject conflicting month-vs-hour paid writer instructions in three real provider-first-chapter compositions (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-normal-paid-hour-editorial-conflict-tests.js
      - name: Price the SOURCE-QUALIFIED customer first chapter instead of unsellable buyer-neutral estimate (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-qualified-buyer-luna-cost-tests.js
      - name: Verify GPT-6 Luna migration body and projected cost in the REAL production serializer (MOCK ONLY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-gpt6-luna-migration-offline-tests.js
      - name: Freeze the current first-chapter provider envelope OFFLINE (no keys, no network)
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-current-core-preflight.js
      - name: Verify new one-call manual approval and no-billing safety offline
        env:
          OPENAI_API_KEY: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-current-core-one-shot-safety-tests.js
      # CI success on a feature branch only means its code passed tests.
      # Feature branches are never assumed to be deployed on Render.
      - name: Explain feature-branch deployment boundary
        if: github.ref != 'refs/heads/saju-mbti-app'
        run: echo "NOT DEPLOYED - feature branch tests do not verify or trigger Render deployment"
      - name: Verify production revision (operating branch only, informational)
        if: github.ref == 'refs/heads/saju-mbti-app'
        continue-on-error: true
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          (async()=>{
            const target='https://first-app-n4ue.onrender.com/api/health';
            try {
              const response=await fetch(target,{signal:AbortSignal.timeout(12000)});
              if(!response.ok)throw Error('health HTTP '+response.status);
              const health=await response.json();
              console.log('Render currently deployed:',health.deployCommit||'unknown');
              console.log('Production branch commit:',process.env.EXPECTED_DEPLOY_SHA);
              if(!health.deployCommit||health.deployCommit!==process.env.EXPECTED_DEPLOY_SHA)
                throw Error('NOT DEPLOYED: branch revision differs from running service');
              console.log('PASS production revision matches operating branch');
            }catch(e){
              console.error('DEPLOYMENT NOT VERIFIED:',String(e.message||e));
              process.exitCode=1;
            }
          })();
          NODE

  visual-mobile-offline:
    # Real Chrome screenshots live in a separate, bounded job. Does NOT
    # contact any AI, merchant, Render deploy, or external user website.
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Korean glyph fonts only if runner lacks them (screenshot readability)
        run: |
          if [ -z "$(fc-list :lang=ko)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-nanum
            fc-cache -f >/dev/null
          fi
          test -n "$(fc-list :lang=ko)"
      - name: Install browser automation driver (uses runner's local Google Chrome)
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
      - name: Test actual local HTML at 320px, 390px and 1280px with file download, no provider API
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
          REPORT_QA_ALLOW_PAYMENT: ''
          WORK59_SCREENSHOT_DIR: ${{ runner.temp }}/work59-visual-screens
        run: node qa-work59-real-browser-mobile.js
      - name: Attach real browser screenshots for human mobile review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work59-real-chromium-mobile-desktop-screenshots
          path: ${{ runner.temp }}/work59-visual-screens/*.png
          if-no-files-found: ignore
          retention-days: 14
