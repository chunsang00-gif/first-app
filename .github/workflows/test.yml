name: saju-mbti-tests
on:
  push:
    branches: [saju-mbti-app, fix-saju-tone-20261010, fix-paid-qa-fact-bindings-20261014]
  pull_request:
    branches: [saju-mbti-app]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Proofread actual FREE templates and 3 manually revised first-chapter drafts (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-free-reading-language-tests.js
      - run: node character-assets-test.js
      - run: npm test
      - name: Verify REAL web server serves every app entry script and denies private files (LOCAL HTTP)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-public-entry-scripts-tests.js
      - name: Verify current-work/learning context is shown ONLY for the matching question (NO API, NO PAYMENT)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-buyer-work-skill-scope-tests.js
      - name: Ensure a free HTTP calculation receipt cannot be reused after work or skill input changes (LOCAL HTTP)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-free-buyer-context-receipt-http-tests.js
      - name: Verify same-chart FREE text is visible to paid first-chapter writer (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-free-baseline-tests.js
      - name: Resolve MONTH-vs-HOUR policy conflict in real paid first-chapter request (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-hour-policy-conflict-tests.js
      - name: Check ACTUAL source-bound paid first-chapter writer for skill, money and pressure (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-domain-boundary-tests.js
      - name: Reject FREE year-hour category reuse before paid order (NO API, NO MERCHANT)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-free-natal-novelty-tests.js
      - name: Reject generic buyer advice unlinked to verified hour role BEFORE next paid call (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-hour-choice-meaning-tests.js
      - name: Verify real paid one-concern skill, money and pressure reader value BEFORE extra paid call (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-single-concern-value-tests.js
      - name: Refuse unreviewable buyer questions BEFORE reserving money or calling paid AI (REAL chart, NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node report-paid-core-precharge-reader-feasibility-tests.js
      - name: Measure how many synthetic buyers can technically get a NEW first paid chapter (NO API/CHARGE)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-adaptive-first-chapter-technical-reach.js
      - name: Pilot distinct birth-DAY hidden category vs FREE and hour-only paid precharge (NO API / PAY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-day-hidden-versus-free-pilot.js
      - name: Cross-check day-hidden candidate against same-chart MONTH repeats and natal relations (NO API / PAY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-day-hidden-cross-pillar-value-tests.js
      - name: Print synthetic day-hidden FREE comparison inputs for authored first-chapter editorial work (NO AI)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-day-hidden-editorial-fixtures.js
      - name: Produce actual same-chart FREE vs 3 offline editorial first-chapter candidate readings (NO AI / NO PAY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: |
          node qa-first-chapter-cross-domain-editorial-pack.js
          node qa-first-chapter-cross-domain-editorial-pack.js --markdown > "$RUNNER_TEMP/paid-first-chapter-three-domain-review.md"
          test -s "$RUNNER_TEMP/paid-first-chapter-three-domain-review.md"
      - name: Attach reviewable human-authored manuscript, not actual AI output
        uses: actions/upload-artifact@v4
        with:
          name: first-chapter-three-domain-manual-editorial-pack
          path: ${{ runner.temp }}/paid-first-chapter-three-domain-review.md
          retention-days: 14
      - name: Compare same-chart free reader with manual paid-first-chapter example (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: |
          node qa-first-chapter-value-audit-tests.js
          node qa-first-chapter-value-audit.js > "$RUNNER_TEMP/first-chapter-public-synthetic-value-audit.md"
          test -s "$RUNNER_TEMP/first-chapter-public-synthetic-value-audit.md"
      - run: npm run smoke
      - name: Verify additional normal-paid monthly evidence without API charges
        run: node report-paid-core-month-nonmain-exposure-tests.js
      - name: Verify paid delivery failure is visible without a new charge or refund promise
        run: node report-paid-delivery-state-tests.js
      - name: Check a DIFFERENT evidence-based first-chapter reading order without paid calls
        run: node report-core-month-exposure-reading-order-tests.js
      - name: Price the SOURCE-QUALIFIED customer first chapter instead of unsellable buyer-neutral estimate (NO API)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-qualified-buyer-luna-cost-tests.js
      - name: Verify GPT-6 Luna migration body and projected cost in the REAL production serializer (MOCK ONLY)
        env:
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-gpt6-luna-migration-offline-tests.js
      - name: Freeze the current first-chapter provider envelope OFFLINE (no keys, no network)
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ''
          REPORT_MODEL_URL: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-current-core-preflight.js
      - name: Verify new one-call manual approval and no-billing safety offline
        env:
          OPENAI_API_KEY: ''
          REPORT_QA_CONFIRM: ''
        run: node qa-current-core-one-shot-safety-tests.js
      # CI success on a feature branch only means its code passed tests.
      # Feature branches are never assumed to be deployed on Render.
      - name: Explain feature-branch deployment boundary
        if: github.ref != 'refs/heads/saju-mbti-app'
        run: echo "NOT DEPLOYED - feature branch tests do not verify or trigger Render deployment"
      - name: Verify production revision (operating branch only, informational)
        if: github.ref == 'refs/heads/saju-mbti-app'
        continue-on-error: true
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          (async()=>{
            const target='https://first-app-n4ue.onrender.com/api/health';
            try {
              const response=await fetch(target,{signal:AbortSignal.timeout(12000)});
              if(!response.ok)throw Error('health HTTP '+response.status);
              const health=await response.json();
              console.log('Render currently deployed:',health.deployCommit||'unknown');
              console.log('Production branch commit:',process.env.EXPECTED_DEPLOY_SHA);
              if(!health.deployCommit||health.deployCommit!==process.env.EXPECTED_DEPLOY_SHA)
                throw Error('NOT DEPLOYED: branch revision differs from running service');
              console.log('PASS production revision matches operating branch');
            }catch(e){
              console.error('DEPLOYMENT NOT VERIFIED:',String(e.message||e));
              process.exitCode=1;
            }
          })();
          NODE
