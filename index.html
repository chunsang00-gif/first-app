option>`).join('');const fillDay=()=>{const yy=+y.value,mm=+m.value,max=yy&&mm?new Date(yy,mm,0).getDate():31;const old=day.value;day.innerHTML='<option value="">일</option>'+Array.from({length:max},(_,i)=>i+1).map(v=>`<option value="${v}">${v}일</option>`).join('');if(+old<=max)day.value=old};m.onchange=fillDay;y.onchange=fillDay;fillDay()}$$('[data-choice]').forEach(g=>g.onclick=e=>{if(!e.target.classList.contains('chip'))return;e.preventDefault();g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');if(g.dataset.choice==='calendar'){$('#leapWrap').classList.toggle('hidden',choice('calendar')!=='lunar');if(choice('calendar')!=='lunar')$('#leapMonth').checked=false}});$('#unknownTime').onchange=e=>{$('#time').disabled=e.target.checked;if(e.target.checked)$('#time').value=''};function data(){const desktopBirth=val('birthYear')&&val('birthMonth')&&val('birthDay')?`${val('birthYear')}-${String(val('birthMonth')).padStart(2,'0')}-${String(val('birthDay')).padStart(2,'0')}`:'';const birthDate=desktopBirth;return {gender:choice('gender'),calendar:choice('calendar'),birthDate,birthTime:val('time'),birthplace:val('city').trim(),unknownBirthTime:$('#unknownTime').checked,leapMonth:$('#leapMonth').checked,name:val('name').trim(),mbti:val('mbti')||'모름'}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function summary(){const d=data(),rows=[['성별',d.gender==='male'?'남성':'여성'],['출생',`${d.calendar==='solar'?'양력':d.leapMonth?'음력 윤달':'음력'} ${d.birthDate} ${d.unknownBirthTime?'시간 모름':d.birthTime}`],['출생도시',d.birthplace],['이름',d.name],['MBTI',d.mbti]];$('#summary').innerHTML=rows.map(x=>`<div class="sumrow"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}function show(){

 }
