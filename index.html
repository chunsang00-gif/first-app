<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171b"><title>민화이팅 일정 다이어리</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#747b86;--line:#e5e8ed;--dark:#15171b;--green:#18835c;--red:#b42318;--soft:#eef1f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit}.app{min-height:100vh;padding-bottom:84px}.topbar{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.96);backdrop-filter:blur(12px);padding:18px 16px 10px}.brand{font-size:24px;font-weight:900}.date{font-size:12px;color:var(--muted);margin-top:4px}.content{padding:8px 14px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,24,31,.04)}.hero h1{font-size:25px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.addrow{display:flex;gap:8px;margin-top:14px}.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fafbfc;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800}.btn.primary{background:var(--dark);color:#fff}.btn.danger{background:var(--red);color:#fff;padding:8px 10px;font-size:12px}.btn.light{background:var(--soft);color:#4c535d}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.tasks{display:grid;gap:10px}.task{border:1px solid var(--line);border-radius:14px;padding:13px}.task.done{background:#fafafa}.task-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.check{width:28px;height:28px;border-radius:8px;border:2px solid #c9cfd7;background:#fff;display:grid;place-items:center;font-weight:900}.task.done .check{background:var(--dark);border-color:var(--dark);color:#fff}.task-title{font-weight:800;line-height:1.35}.task-status{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;align-items:center}.badge{font-size:11px;padding:5px 7px;border-radius:999px;background:var(--soft);color:#59616c}.badge.done{background:#e9f5ef;color:var(--green)}.note-wrap{margin-top:10px;padding-left:38px}.note-wrap label{display:block;font-size:12px;font-weight:800;color:#5c636d;margin-bottom:6px}.note-wrap textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical;background:#fafbfc}.done-time{font-size:12px;color:var(--green);font-weight:700;margin-top:6px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #ccd2da;border-radius:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:27px;margin-top:6px}.log{display:grid;gap:9px}.logitem{border:1px solid var(--line);border-radius:13px;padding:12px}.logtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.logitem b{display:block;margin:5px 0}.lognote{font-size:14px;color:#4e555e;white-space:pre-wrap}.logtime{font-size:12px;color:var(--muted);margin-top:5px}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.month{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.month b{display:block;font-size:22px;margin-top:4px}.progress{height:9px;border-radius:999px;background:#eceff3;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--dark)}.view{display:none}.view.active{display:block}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.tabs button{border:0;background:transparent;padding:8px 2px;font-size:12px;color:#747b86;font-weight:700}.tabs button.active{color:#111;font-weight:900}.modal{position:fixed;inset:0;background:rgba(15,17,21,.5);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheet h3{margin:0 0 14px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#5f6670}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:16px}.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media(min-width:800px){.app{padding-bottom:20px}.tabs{position:sticky;top:0;bottom:auto;max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:14px}.topbar{position:static}.content{padding-top:14px}}</style></head><body><div class="app"><header class="topbar"><div class="brand">민화이팅 일정 다이어리</div><div class="date" id="date"></div></header><main class="content"><section id="today" class="view active"><div class="card hero"><h1>오늘 할 일</h1><p>완료 체크한 일정은 주간·월간에 자동으로 기록됩니다.</p><div class="addrow"><input id="quick" placeholder="예: 보험 서류 확인"><button id="addBtn" class="btn primary">추가</button></div></div><div class="card"><div class="section-title"><h2>오늘 일정</h2><span id="todaySummary">0개</span></div><div id="taskList" class="tasks"></div></div></section><section id="week" class="view"><div class="card"><div class="section-title"><h2>7일 프로젝트</h2><button id="newProjectBtn" class="btn primary">새 프로젝트</button></div><div id="projectArea"></div></div><div class="card"><div class="section-title"><h2>이번 주 완료 기록</h2><span id="weekSummary">0개</span></div><div id="weekLog" class="log"></div></div></section><section id="month" class="view"><div class="stats"><div class="stat">이번 달 완료<b id="mDone">0</b></div><div class="stat">실행 메모<b id="mNotes">0</b></div><div class="stat">실행일<b id="mDays">0</b></div><div class="stat">프로젝트<b id="mProjects">0</b></div></div><div class="card" style="margin-top:12px"><div class="section-title"><h2>이번 달 완료 기록</h2><span>여기서도 삭제 가능</span></div><div id="monthLog" class="log"></div></div></section><section id="year" class="view"><div class="card"><div class="section-title"><h2>연간 흐름</h2></div><div id="months" class="months"></div></div></section><section id="record" class="view"><div class="card"><div class="section-title"><h2>전체 실행 기록</h2></div><div id="allLog" class="log"></div></div></section></main></div><nav class="tabs"><button class="active" data-view="today">오늘</button><button data-view="week">이번 주</button><button data-view="month">월간</button><button data-view="year">연간</button><button data-view="record">기록</button></nav><div id="projectModal" class="modal"><div class="sheet"><h3>새 7일 프로젝트</h3><div class="field"><label>프로젝트 이름</label><input id="pName"></div><div class="field"><label>이번 주 목표</label><input id="pGoal"></div><div class="field"><label>단계</label><textarea id="pStepsInput" rows="6" placeholder="한 줄에 하나씩 적으세요"></textarea></div><div class="sheet-actions"><button id="cancelProjectBtn" class="btn light">취소</button><button id="saveProjectBtn" class="btn primary">시작</button></div></div></div><script>(()=>{const KEY='minfighting-diary-v1',initial=()=>({tasks:[],project:null});let memory=initial();function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):initial()}catch(e){return memory}}let state=load();function persist(){memory=state;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}function day(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function fmt(i){return i?new Date(i).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}const $=id=>document.getElementById(id);$('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});function addTask(){const e=$('quick'),t=e.value.trim();if(!t)return;state.tasks.unshift({id:Date.now(),title:t,note:'',done:false,created:day(),completedAt:null});e.value='';persist()}function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;persist()}function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!t||!confirm('“'+t.title+'” 일정을 완전히 삭제할까요?'))return;state.tasks=state.tasks.filter(x=>x.id!==id);persist()}function noteTask(id,v){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.note=v;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function openProject(){$('projectModal').classList.add('show')}function closeProject(){$('projectModal').classList.remove('show')}function saveProject(){const n=$('pName').value.trim();if(!n)return alert('프로젝트 이름을 적어주세요.');const g=$('pGoal').value.trim();let a=$('pStepsInput').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!a.length)a=['첫 단계 시작','중간 결과 만들기','마무리'];state.project={title:n,goal:g,created:day(),steps:a.map((title,i)=>({id:Date.now()+i,title,note:'',done:false,completedAt:null}))};$('pName').value='';$('pGoal').value='';$('pStepsInput').value='';closeProject();persist()}function toggleStep(id){if(!state.project)return;const s=state.project.steps.find(x=>x.id===id);if(!s)return;s.done=!s.done;s.completedAt=s.done?new Date().toISOString():null;persist()}function noteStep(id,v){if(!state.project)return;const s=state.project.steps.find(x=>x.id===id);if(!s)return;s.note=v;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function deleteStep(id){if(!state.project)return;const s=state.project.steps.find(x=>x.id===id);if(!s||!confirm('“'+s.title+'” 단계를 삭제할까요?'))return;state.project.steps=state.project.steps.filter(x=>x.id!==id);persist()}function deleteProject(){if(!state.project||!confirm('현재 프로젝트를 완전히 삭제할까요?'))return;state.project=null;persist()}function taskHtml(t){return `<div class="task ${t.done?'done':''}"><div class="task-head"><button class="check" data-action="toggle-task" data-id="${t.id}">${t.done?'✓':''}</button><div><div class="task-title">${esc(t.title)}</div><div class="task-status">${t.done?'완료됨 · 다시 누르면 취소':'진행 중'}</div></div><div class="actions"><span class="badge ${t.done?'done':''}">${t.done?'완료':'진행'}</span><button class="btn danger" data-action="delete-task" data-id="${t.id}">삭제</button></div></div><div class="note-wrap"><label>실제로 한 내용</label><textarea data-note-task="${t.id}" placeholder="실제로 한 내용을 적으세요">${esc(t.note||'')}</textarea>${t.done?`<div class="done-time">완료 ${fmt(t.completedAt)}</div>`:''}</div></div>`}function projectHtml(){if(!state.project)return '<div class="empty">아직 프로젝트가 없습니다.</div>';const p=state.project,d=p.steps.filter(x=>x.done).length,r=p.steps.length?Math.round(d/p.steps.length*100):0;return `<div><div style="display:flex;justify-content:space-between;gap:10px"><div><h3 style="margin:0 0 5px">${esc(p.title)}</h3><div style="color:var(--muted);font-size:14px">${esc(p.goal||'')}</div></div><button class="btn danger" data-action="delete-project">프로젝트 삭제</button></div><div class="progress"><div style="width:${r}%"></div></div><div style="font-size:12px;color:var(--muted);margin:7px 0 14px">${d}/${p.steps.length} 단계 완료 · ${r}%</div><div class="tasks">${p.steps.map(s=>`<div class="task ${s.done?'done':''}"><div class="task-head"><button class="check" data-action="toggle-step" data-id="${s.id}">${s.done?'✓':''}</button><div><div class="task-title">${esc(s.title)}</div><div class="task-status">${s.done?'완료됨':'진행 중'}</div></div><button class="btn danger" data-action="delete-step" data-id="${s.id}">삭제</button></div><div class="note-wrap"><label>실제로 한 내용</label><textarea data-note-step="${s.id}">${esc(s.note||'')}</textarea>${s.done?`<div class="done-time">완료 ${fmt(s.completedAt)}</div>`:''}</div></div>`).join('')}</div></div>`}function completed(){const a=[];state.tasks.filter(x=>x.done&&x.completedAt).forEach(x=>a.push({kind:'task',id:x.id,title:x.title,note:x.note,time:x.completedAt,type:'일정'}));if(state.project)state.project.steps.filter(x=>x.done&&x.completedAt).forEach(x=>a.push({kind:'step',id:x.id,title:x.title,note:x.note,time:x.completedAt,type:state.project.title}));return a.sort((x,y)=>new Date(y.time)-new Date(x.time))}function weekBounds(){const d=new Date(),n=(d.getDay()+6)%7,s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-n),e=new Date(s);e.setDate(s.getDate()+7);return[s,e]}function logHtml(a){return a.length?a.map(x=>`<div class="logitem"><div class="logtop"><div><span class="badge done">${esc(x.type)}</span><b>${esc(x.title)}</b></div><button class="btn danger" data-action="delete-log" data-kind="${x.kind}" data-id="${x.id}">삭제</button></div><div class="lognote">${x.note?esc(x.note):'실행 메모 없음'}</div><div class="logtime">${fmt(x.time)}</div></div>`).join(''):'<div class="empty">완료 기록이 없습니다.</div>'}function deleteLog(k,id){if(k==='task'){const t=state.tasks.find(x=>x.id===id);if(!t||!confirm('이 완료 기록과 원본 일정을 모두 삭제할까요?'))return;state.tasks=state.tasks.filter(x=>x.id!==id)}else if(k==='step'&&state.project){const s=state.project.steps.find(x=>x.id===id);if(!s||!confirm('이 완료 기록과 프로젝트 단계를 모두 삭제할까요?'))return;state.project.steps=state.project.steps.filter(x=>x.id!==id)}persist()}function render(){const td=state.tasks.filter(x=>x.created===day());$('taskList').innerHTML=td.length?td.map(taskHtml).join(''):'<div class="empty">오늘 일정이 없습니다.</div>';$('todaySummary').textContent=td.filter(x=>x.done).length+'완료 / '+td.length+'개';$('projectArea').innerHTML=projectHtml();const all=completed(),[ws,we]=weekBounds(),week=all.filter(x=>{const d=new Date(x.time);return d>=ws&&d<we});$('weekSummary').textContent=week.length+'개';$('weekLog').innerHTML=logHtml(week);const ym=day().slice(0,7),month=all.filter(x=>x.time.slice(0,7)===ym);$('mDone').textContent=month.length;$('mNotes').textContent=month.filter(x=>(x.note||'').trim()).length;$('mDays').textContent=new Set(month.map(x=>x.time.slice(0,10))).size;$('mProjects').textContent=state.project&&state.project.created.slice(0,7)===ym?1:0;$('monthLog').innerHTML=logHtml(month);$('allLog').innerHTML=logHtml(all);const y=new Date().getFullYear();let h='';for(let m=1;m<=12;m++){const pre=y+'-'+String(m).padStart(2,'0'),c=all.filter(x=>x.time.slice(0,7)===pre).length;h+=`<div class="month">${m}월<b>${c}</b><span style="font-size:12px;color:var(--muted)">완료</span></div>`}$('months').innerHTML=h}$('addBtn').addEventListener('click',addTask);$('quick').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});$('newProjectBtn').addEventListener('click',openProject);$('cancelProjectBtn').addEventListener('click',closeProject);$('saveProjectBtn').addEventListener('click',saveProject);document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.view).classList.add('active');render()}));document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id),a=b.dataset.action;if(a==='toggle-task')toggleTask(id);if(a==='delete-task')deleteTask(id);if(a==='toggle-step')toggleStep(id);if(a==='delete-step')deleteStep(id);if(a==='delete-project')deleteProject();if(a==='delete-log')deleteLog(b.dataset.kind,id)});document.addEventListener('input',e=>{if(e.target.matches('[data-note-task]'))noteTask(Number(e.target.dataset.noteTask),e.target.value);if(e.target.matches('[data-note-step]'))noteStep(Number(e.target.dataset.noteStep),e.target.value)});render()})();</script></body></html>
