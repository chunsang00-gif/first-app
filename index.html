<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171b"><title>민화이팅 일정 다이어리</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#747b86;--line:#e5e8ed;--dark:#15171b;--green:#18835c;--red:#b42318;--soft:#eef1f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit}.app{min-height:100vh;padding-bottom:84px}.topbar{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.96);backdrop-filter:blur(12px);padding:18px 16px 10px}.brand{font-size:24px;font-weight:900}.date{font-size:12px;color:var(--muted);margin-top:4px}.content{padding:8px 14px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,24,31,.04)}.hero h1{font-size:25px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.addrow{display:flex;gap:8px;margin-top:14px}.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fafbfc;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800}.btn.primary{background:var(--dark);color:#fff}.btn.danger{background:var(--red);color:#fff;padding:8px 10px;font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.tasks{display:grid;gap:10px}.task{border:1px solid var(--line);border-radius:14px;padding:13px}.task.done{background:#fafafa}.task-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.check{width:28px;height:28px;border-radius:8px;border:2px solid #c9cfd7;background:#fff;display:grid;place-items:center;font-weight:900}.task.done .check{background:var(--dark);border-color:var(--dark);color:#fff}.task-title{font-weight:800;line-height:1.35}.task-status{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;align-items:center}.badge{font-size:11px;padding:5px 7px;border-radius:999px;background:var(--soft);color:#59616c}.badge.done{background:#e9f5ef;color:var(--green)}.note-wrap{margin-top:10px;padding-left:38px}.note-wrap label{display:block;font-size:12px;font-weight:800;color:#5c636d;margin-bottom:6px}.note-wrap textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical;background:#fafbfc}.done-time{font-size:12px;color:var(--green);font-weight:700;margin-top:6px}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #ccd2da;border-radius:13px}.view{display:none}.view.active{display:block}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.tabs button{border:0;background:transparent;padding:8px 2px;font-size:12px;color:#747b86;font-weight:700}.tabs button.active{color:#111;font-weight:900}.daycard{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;background:#fff}.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.dayname{font-weight:900;font-size:16px}.daydate{font-size:12px;color:var(--muted)}.dayitems{display:grid;gap:8px}.dayitem{border-top:1px solid var(--line);padding-top:8px}.dayitem:first-child{border-top:0;padding-top:0}.dayitem-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.dayitem-title{font-weight:800}.dayitem-note{font-size:13px;color:#555;margin-top:4px;white-space:pre-wrap}.week-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.mini b{display:block;font-size:22px;margin-top:5px}.monthweek{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.monthweek h3{font-size:15px;margin:0 0 8px}.monthdays{display:grid;gap:7px}.monthday{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:7px;font-size:13px}.monthday:first-child{border-top:0;padding-top:0}.monthday .left{font-weight:700}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.month{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.month b{display:block;font-size:22px;margin-top:4px}.logitem{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}.logtop{display:flex;justify-content:space-between;gap:8px}.logitem b{display:block;margin:5px 0}.lognote{font-size:14px;color:#4e555e;white-space:pre-wrap}.logtime{font-size:12px;color:var(--muted);margin-top:5px}@media(min-width:800px){.app{padding-bottom:20px}.tabs{position:sticky;top:0;bottom:auto;max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:14px}.topbar{position:static}.content{padding-top:14px}}</style></head><body><div class="app"><header class="topbar"><div class="brand">민화이팅 일정 다이어리</div><div class="date" id="date"></div></header><main class="content"><section id="today" class="view active"><div class="card hero"><h1>오늘</h1><p>오늘 한 일이 주간·월간으로 자동 누적됩니다.</p><div class="addrow"><input id="quick" placeholder="예: 보험 서류 확인"><button id="addBtn" class="btn primary">추가</button></div></div><div class="card"><div class="section-title"><h2>오늘 일정</h2><span id="todaySummary">0개</span></div><div id="taskList" class="tasks"></div></div></section><section id="week" class="view"><div class="card"><div class="section-title"><h2>주간 · 월요일~일요일</h2><span id="weekRange"></span></div><div class="week-summary"><div class="mini">완료<b id="wDone">0</b></div><div class="mini">실행일<b id="wDays">0</b></div><div class="mini">메모<b id="wNotes">0</b></div></div></div><div id="weekDays"></div></section><section id="month" class="view"><div class="card"><div class="section-title"><h2 id="monthTitle">월간</h2><span id="monthSummary"></span></div><div id="monthWeeks"></div></div></section><section id="year" class="view"><div class="card"><div class="section-title"><h2>연간 흐름</h2></div><div id="months" class="months"></div></div></section><section id="record" class="view"><div class="card"><div class="section-title"><h2>전체 실행 기록</h2></div><div id="allLog"></div></div></section></main></div><nav class="tabs"><button class="active" data-view="today">오늘</button><button data-view="week">주간</button><button data-view="month">월간</button><button data-view="year">연간</button><button data-view="record">기록</button></nav><script>(()=>{const KEY='minfighting-diary-v1',initial=()=>({tasks:[],project:null});let memory=initial();function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):initial()}catch(e){return memory}}let state=load();function persist(){memory=state;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}function ymd(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseYmd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function fmt(i){return i?new Date(i).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}const $=id=>document.getElementById(id);$('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});function addTask(){const e=$('quick'),t=e.value.trim();if(!t)return;state.tasks.unshift({id:Date.now(),title:t,note:'',done:false,created:ymd(),completedAt:null});e.value='';persist()}function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;persist()}function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!t||!confirm('“'+t.title+'” 일정을 완전히 삭제할까요?'))return;state.tasks=state.tasks.filter(x=>x.id!==id);persist()}function noteTask(id,v){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.note=v;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function taskHtml(t){return `<div class="task ${t.done?'done':''}"><div class="task-head"><button class="check" data-action="toggle-task" data-id="${t.id}">${t.done?'✓':''}</button><div><div class="task-title">${esc(t.title)}</div><div class="task-status">${t.done?'완료됨 · 다시 누르면 취소':'진행 중'}</div></div><div class="actions"><span class="badge ${t.done?'done':''}">${t.done?'완료':'진행'}</span><button class="btn danger" data-action="delete-task" data-id="${t.id}">삭제</button></div></div><div class="note-wrap"><label>실제로 한 내용</label><textarea data-note-task="${t.id}" placeholder="실제로 한 내용을 적으세요">${esc(t.note||'')}</textarea>${t.done?`<div class="done-time">완료 ${fmt(t.completedAt)}</div>`:''}</div></div>`}function completed(){return state.tasks.filter(x=>x.done&&x.completedAt).map(x=>({id:x.id,title:x.title,note:x.note,time:x.completedAt,date:ymd(new Date(x.completedAt))})).sort((a,b)=>new Date(b.time)-new Date(a.time))}function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function weekDates(base=new Date()){const s=mondayOf(base);return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d})}function dayLogHtml(items){if(!items.length)return '<div class="empty">완료한 일정 없음</div>';return `<div class="dayitems">${items.map(x=>`<div class="dayitem"><div class="dayitem-top"><div><div class="dayitem-title">${esc(x.title)}</div><div class="dayitem-note">${x.note?esc(x.note):'실행 메모 없음'}</div></div><button class="btn danger" data-action="delete-task" data-id="${x.id}">삭제</button></div><div class="logtime">${fmt(x.time)}</div></div>`).join('')}</div>`}function renderWeek(all){const ds=weekDates(),names=['월','화','수','목','금','토','일'];$('weekRange').textContent=`${ds[0].getMonth()+1}/${ds[0].getDate()} ~ ${ds[6].getMonth()+1}/${ds[6].getDate()}`;let total=0,notes=0,days=0,h='';ds.forEach((d,i)=>{const key=ymd(d),items=all.filter(x=>x.date===key);if(items.length)days++;total+=items.length;notes+=items.filter(x=>(x.note||'').trim()).length;h+=`<div class="daycard"><div class="dayhead"><div class="dayname">${names[i]}요일</div><div class="daydate">${d.getMonth()+1}/${d.getDate()}</div></div>${dayLogHtml(items)}</div>`});$('wDone').textContent=total;$('wDays').textContent=days;$('wNotes').textContent=notes;$('weekDays').innerHTML=h}function weeksOfMonth(y,m){const first=new Date(y,m,1),last=new Date(y,m+1,0);let cur=mondayOf(first);const out=[];while(cur<=last){const days=[];for(let i=0;i<7;i++){const d=new Date(cur);d.setDate(cur.getDate()+i);days.push(d)}out.push(days);cur=new Date(cur);cur.setDate(cur.getDate()+7)}return out}function renderMonth(all){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),weeks=weeksOfMonth(y,m);$('monthTitle').textContent=`${y}년 ${m+1}월`;$('monthSummary').textContent=all.filter(x=>{const d=new Date(x.time);return d.getFullYear()===y&&d.getMonth()===m}).length+'개 완료';let h='';weeks.forEach((days,idx)=>{const entries=[];days.forEach(d=>{if(d.getMonth()!==m)return;const key=ymd(d),items=all.filter(x=>x.date===key);if(items.length)entries.push({d,items})});h+=`<div class="monthweek"><h3>${idx+1}주차 · ${days[0].getMonth()+1}/${days[0].getDate()} ~ ${days[6].getMonth()+1}/${days[6].getDate()}</h3>${entries.length?`<div class="monthdays">${entries.map(e=>`<div class="monthday"><div class="left">${e.d.getDate()}일 (${['일','월','화','수','목','금','토'][e.d.getDay()]})</div><div>${e.items.length}개 완료</div></div>${e.items.map(x=>`<div class="logitem"><div class="logtop"><div><b>${esc(x.title)}</b><div class="lognote">${x.note?esc(x.note):'실행 메모 없음'}</div></div><button class="btn danger" data-action="delete-task" data-id="${x.id}">삭제</button></div><div class="logtime">${fmt(x.time)}</div></div>`).join('')}`).join('')}</div>`:'<div class="empty">기록 없음</div>'}</div>`});$('monthWeeks').innerHTML=h}function render(){const td=state.tasks.filter(x=>x.created===ymd());$('taskList').innerHTML=td.length?td.map(taskHtml).join(''):'<div class="empty">오늘 일정이 없습니다.</div>';$('todaySummary').textContent=td.filter(x=>x.done).length+'완료 / '+td.length+'개';const all=completed();renderWeek(all);renderMonth(all);const y=new Date().getFullYear();let mh='';for(let m=1;m<=12;m++){const c=all.filter(x=>{const d=new Date(x.time);return d.getFullYear()===y&&d.getMonth()===m-1}).length;mh+=`<div class="month">${m}월<b>${c}</b><span style="font-size:12px;color:var(--muted)">완료</span></div>`}$('months').innerHTML=mh;$('allLog').innerHTML=all.length?all.map(x=>`<div class="logitem"><div class="logtop"><div><b>${esc(x.title)}</b><div class="lognote">${x.note?esc(x.note):'실행 메모 없음'}</div></div><button class="btn danger" data-action="delete-task" data-id="${x.id}">삭제</button></div><div class="logtime">${fmt(x.time)}</div></div>`).join(''):'<div class="empty">완료 기록이 없습니다.</div>'}$('addBtn').addEventListener('click',addTask);$('quick').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.view).classList.add('active');render()}));document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id);if(b.dataset.action==='toggle-task')toggleTask(id);if(b.dataset.action==='delete-task')deleteTask(id)});document.addEventListener('input',e=>{if(e.target.matches('[data-note-task]'))noteTask(Number(e.target.dataset.noteTask),e.target.value)});render()})();</script></body></html>
