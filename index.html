<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>사주 × MBTI</title><style>:root{--bg:#f6f5f2;--card:#fff;--ink:#17191d;--muted:#70757f;--line:#e7e3dc;--accent:#26354a;--gold:#98753d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;padding:20px 18px 12px;background:#f6f5f2ee;backdrop-filter:blur(10px)}.brand,.eyebrow,.num{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--gold)}.progress{height:4px;margin-top:12px;background:#e3e0da;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:20%;background:var(--accent);transition:.2s}.screen{display:none;padding:18px}.screen.active{display:block}.title{font-size:29px;line-height:1.25;letter-spacing:-.04em;margin:8px 0}.desc,.meta{font-size:14px;color:var(--muted);line-height:1.65}.card,.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:18px 0}.field{margin-bottom:16px}.field:last-child{margin:0}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #d9d5cf;border-radius:13px;background:#fff;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #d9d5cf;background:#fff;border-radius:99px;padding:10px 14px;font-weight:800}.chip.on{background:var(--accent);color:#fff}.check{display:flex;align-items:center;gap:8px;margin-top:9px;font-weight:600}.check input{width:auto}.actions{display:flex;gap:9px;padding:8px 18px 28px}.btn{border:0;border-radius:14px;padding:14px 17px;font-weight:900}.primary{background:var(--accent);color:#fff;flex:1}.ghost{background:#e7e4de}.hidden{display:none!important}.sumrow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.sumrow:last-child{border:0}.sumrow span{color:var(--muted)}.section{padding:26px 19px}.section h2{font-size:22px;margin:7px 0 17px}.section p{font-size:15.5px;line-height:1.85;color:#2d3036}.verdict{margin-top:20px;padding:17px;border-radius:15px;background:#f0f1f3;border-left:4px solid var(--accent)}.verdict b{font-size:12px;color:var(--gold)}.verdict p{font-size:17px;font-weight:850}.quote{font-size:19px!important;font-weight:900!important}.status{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;line-height:1.7}@media(max-width:480px){.row{grid-template-columns:1fr}.title{font-size:27px}}.result-hero{position:relative;overflow:hidden;margin:6px 0 20px;padding:24px;border-radius:26px;background:linear-gradient(135deg,#fff7ee,#eef5ff 58%,#f5efff);border:1px solid #ebe4dc;box-shadow:0 12px 34px #42331d0d}.hero-copy{position:relative;z-index:1;max-width:82%}.result-hero h1{font-size:36px;letter-spacing:-.055em;margin:8px 0 10px}.hero-badges,.tag-row{display:flex;gap:7px;flex-wrap:wrap}.hero-badges span{padding:7px 11px;border-radius:99px;background:#fff;border:1px solid #e7e0d8;font-size:13px;font-weight:900}.hero-line{font-size:19px;line-height:1.55;font-weight:900;letter-spacing:-.025em;margin:20px 0}.tag-row span{font-size:12px;background:#ffffffb8;padding:7px 9px;border-radius:99px}.zodiac-mark{position:absolute;right:17px;top:21px;width:68px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:22px;background:#fff;box-shadow:0 8px 24px #26354a16}.zodiac-mark span{font-size:17px;font-weight:950;letter-spacing:-.06em}.zodiac-mark small{margin-top:2px;font-size:10px;font-weight:850;color:var(--muted)}.quick-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:18px 0}.quick-card h2{margin:7px 0 15px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-link{appearance:none;text-align:left;border:0;padding:15px;border-radius:17px;background:#f7f7f5;color:var(--ink);font:inherit;cursor:pointer}.quick-link:active{transform:scale(.985)}.quick-link strong{font-size:14px}.quick-link p{font-size:13px;line-height:1.55;color:#555b65;margin:8px 0}.quick-link span{font-size:12px;font-weight:850;color:#667085}.full-report-action{margin:16px 0 22px}.full-report-action .btn{width:100%;font-size:15px}.detail-section{position:relative;overflow:hidden;scroll-margin-top:82px;background:linear-gradient(180deg,#fff,#fffdfa);border-top:5px solid #e9e5df}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}.detail-head h2{letter-spacing:-.04em;margin-bottom:0}.detail-symbol{flex:0 0 48px;height:48px;display:grid;place-items:center;border-radius:16px;background:#f4f3f0;font-size:20px;font-weight:950}.detail-copy p{font-size:16px;line-height:1.92;letter-spacing:-.012em}.evidence-box{margin:0 0 18px;padding:14px 15px;border-radius:15px;background:#f7f6f3;border:1px solid #ebe7e0}.evidence-box b{display:block;margin-bottom:8px;font-size:12px;color:var(--gold)}.evidence-box ul{margin:0;padding-left:18px}.evidence-box li{margin:5px 0;font-size:13px;line-height:1.55;color:#555b65}.back-summary{border:0;background:transparent;padding:15px 0 0;font:inherit;font-size:12px;font-weight:850;color:#7b7f87}.tone-saju{border-top-color:#c9b28a}.tone-mbti{border-top-color:#b8a7d9}.tone-decision{border-top-color:#9fb6ca}.tone-money{border-top-color:#b9c99b}.tone-career{border-top-color:#99b9b4}.tone-relation{border-top-color:#d9aaa8}.tone-stress{border-top-color:#b6b8c9}.tone-integrated{border-top-color:#9ea5b7}.tone-year{border-top-color:#c8b5d8}.tone-money .detail-symbol{background:#f1f6e9}.tone-career .detail-symbol{background:#edf6f4}.tone-relation .detail-symbol{background:#fff0ef}.tone-year .detail-symbol{background:#f5effa}.saju-table-wrap{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--line);border-radius:16px;background:#fff}.saju-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.saju-table th,.saju-table td{padding:12px 11px;text-align:left;border-bottom:1px solid #eeeae4;vertical-align:top}.saju-table thead th{background:#f7f3ec;font-size:12px;color:#6e665b}.saju-table thead th:first-child,.saju-table tbody th{width:54px}.saju-table thead th:nth-child(2),.saju-table tbody td:nth-child(2){width:62px}.saju-table tbody th{color:#8a6d3c}.saju-table tbody td:nth-child(2){font-size:16px;font-weight:900}.saju-table td{overflow-wrap:anywhere;word-break:keep-all}.saju-table tr:last-child th,.saju-table tr:last-child td{border-bottom:0}.share-card{margin:18px 0;padding:21px;border-radius:23px;background:linear-gradient(145deg,#202a3a,#39465a);color:#fff;box-shadow:0 14px 34px #202a3a1f}.share-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.share-card h2{margin:7px 0 0;font-size:22px;letter-spacing:-.04em}.share-card p{font-size:16px;line-height:1.65;font-weight:800;margin:18px 0}.share-zodiac{display:grid;place-items:center;min-width:52px;height:52px;padding:0 10px;border-radius:16px;background:#ffffff16;border:1px solid #ffffff26;font-size:14px;font-weight:950}.share-mini{display:flex;gap:7px;margin-bottom:15px}.share-mini span{padding:6px 9px;border-radius:99px;background:#ffffff16;border:1px solid #ffffff26;font-size:12px;font-weight:850}.share-btn{width:100%;background:#fff;color:#202a3a}.report-end-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 36px}.report-end-actions .btn{width:100%}.final-card{background:linear-gradient(145deg,#fff,#f7f2ff)}@media(max-width:380px){.report-end-actions{grid-template-columns:1fr}}@media(max-width:480px){.saju-table-wrap{overflow:visible}.saju-table th,.saju-table td{padding:10px 7px}.saju-table{font-size:12px}.saju-table tbody td:nth-child(2){font-size:15px}.section{padding:23px 16px}.detail-copy p{font-size:15.5px;line-height:1.88}.hero-copy{max-width:100%}.zodiac-mark{position:static;margin:14px 0 0}.quick-grid{grid-template-columns:1fr}.result-hero h1{font-size:32px}}</style></head><body><main class="app"><header class="top"><div class="brand">SAJU × MBTI</div><div class="progress"><i id="bar"></i></div></header><section class="screen active" data-step="1"><div class="eyebrow">STEP 01</div><h1 class="title">태어난 정보를 알려주세요</h1><p class="desc">사주 계산에 필요한 정보입니다.</p><div class="card"><div class="field"><label>성별</label><div class="chips" data-choice="gender"><button class="chip on" data-v="male">남성</button><button class="chip" data-v="female">여성</button></div></div><div class="field"><label>달력</label><div class="chips" data-choice="calendar"><button class="chip on" data-v="solar">양력</button><button class="chip" data-v="lunar">음력</button></div><label id="leapWrap" class="check hidden"><input id="leapMonth" type="checkbox">윤달</label></div><div class="field"><label>생년월일</label><input id="birth" type="date"></div><div class="row"><div class="field"><label>출생시간</label><input id="time" type="time"><label class="check"><input id="unknownTime" type="checkbox">출생시간 모름</label></div><div class="field"><label>출생도시</label><input id="city" autocomplete="address-level2" placeholder="예: 서울"></div></div></div></section><section class="screen" data-step="2"><div class="eyebrow">STEP 02</div><h1 class="title">이름과 MBTI를 알려주세요</h1><p class="desc">이름은 결과 화면에만 표시됩니다.</p><div class="card"><div class="field"><label>이름</label><input id="name" autocomplete="name" placeholder="예: 김민수"></div><div class="field"><label>MBTI</label><select id="mbti"><option>모름</option><option>ISFP</option><option>INFP</option><option>ISTP</option><option>INTP</option><option>ISFJ</option><option>INFJ</option><option>ISTJ</option><option>INTJ</option><option>ESFP</option><option>ENFP</option><option>ESTP</option><option>ENTP</option><option>ESFJ</option><option>ENFJ</option><option>ESTJ</option><option>ENTJ</option></select></div></div></section><section class="screen" data-step="3"><div class="eyebrow">STEP 03</div><h1 class="title">입력 정보를 확인해주세요</h1><div class="card" id="summary"></div></section><section class="screen" data-step="4"><div class="eyebrow">사주 × MBTI 개인 리포트</div><h1 class="title" id="reportTitle">분석 결과</h1><div class="meta" id="reportMeta"></div><article id="reportBody"></article></section><div class="actions" id="actions"><button class="btn ghost hidden" id="prev">이전</button><button class="btn primary" id="next">다음</button></div></main><script src="report-validator.js"></script><script src="report-prompt.js"></script><script src="report-renderer.js"></script><script src="report-api-contract.js"></script><script src="live-report-ui.js"></script><script>(()=>{let step=1;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],choice=n=>document.querySelector(`[data-choice="${n}"] .chip.on`)?.dataset.v||'',val=id=>document.getElementById(id)?.value||'';$$('[data-choice]').forEach(g=>g.onclick=e=>{if(!e.target.classList.contains('chip'))return;e.preventDefault();g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');if(g.dataset.choice==='calendar'){$('#leapWrap').classList.toggle('hidden',choice('calendar')!=='lunar');if(choice('calendar')!=='lunar')$('#leapMonth').checked=false}});$('#unknownTime').onchange=e=>{$('#time').disabled=e.target.checked;if(e.target.checked)$('#time').value=''};function data(){return {gender:choice('gender'),calendar:choice('calendar'),birthDate:val('birth'),birthTime:val('time'),birthplace:val('city').trim(),unknownBirthTime:$('#unknownTime').checked,leapMonth:$('#leapMonth').checked,name:val('name').trim(),mbti:val('mbti')||'모름'}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function summary(){const d=data(),rows=[['성별',d.gender==='male'?'남성':'여성'],['출생',`${d.calendar==='solar'?'양력':d.leapMonth?'음력 윤달':'음력'} ${d.birthDate} ${d.unknownBirthTime?'시간 모름':d.birthTime}`],['출생도시',d.birthplace],['이름',d.name],['MBTI',d.mbti]];$('#summary').innerHTML=rows.map(x=>`<div class="sumrow"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}function show(){$$('.screen').forEach(x=>x.classList.toggle('active',+x.dataset.step===step));$('#bar').style.width=step*25+'%';$('#prev').classList.toggle('hidden',step===1);$('#actions').classList.toggle('hidden',step===4);if(step===3)summary();if(step===4){const d=data();$('#reportTitle').textContent=(d.name||'당신')+'님의 사주 × MBTI 분석';$('#reportMeta').textContent=`${d.birthDate} · ${d.unknownBirthTime?'출생시간 모름':d.birthTime} · ${d.birthplace} · MBTI ${d.mbti}`;LIVE_REPORT_UI.run()}scrollTo(0,0)}$('#next').onclick=()=>{const d=data();if(step===1&&(!d.birthDate||!d.birthplace||(!d.birthTime&&!d.unknownBirthTime)))return alert('출생 정보를 확인해주세요.');if(step===2&&!d.name)return alert('이름을 입력해주세요.');if(step<4){step++;show()}};$('#prev').onclick=()=>{if(step>1){step--;show()}};show()})();</script></body></html>
