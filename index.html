<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171b"><title>민화이팅 일정 다이어리</title><style>:root{--bg:#f6f7f9;--card:#fff;--text:#17191d;--muted:#7b818c;--line:#e6e8ed;--dark:#15171b;--red:#b42318;--green:#17885e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;padding-bottom:82px}button,input,textarea{font:inherit}header{background:var(--dark);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:900}.tag{font-size:12px;color:#9ca3af;margin-top:4px}.wrap{padding:14px;max-width:760px;margin:auto}.view{display:none}.view.active{display:block}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{font-size:25px;line-height:1.2;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:6px}.date{font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 8px 24px rgba(20,24,31,.05);margin-bottom:12px}.eyebrow{font-size:11px;color:var(--muted);font-weight:800}.quick{display:grid;gap:9px;margin-top:12px}.quick input,.note textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:13px}.quick button,.primary{min-height:48px;border:0;border-radius:12px;background:var(--dark);color:#fff;font-weight:800}.score{font-size:38px;font-weight:900;margin-top:5px}.barw{height:8px;background:#edf0f3;border-radius:999px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--dark);width:0}.tasks{display:grid;gap:10px}.task{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.task.done{background:#fafafa}.row{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}.check{width:27px;height:27px;border:2px solid #cdd2d9;border-radius:9px;display:grid;place-items:center;font-weight:900}.done .check{background:var(--dark);border-color:var(--dark);color:#fff}.title{font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}.status,.danger{font-size:12px;border-radius:9px;padding:7px 10px}.status{background:#f1f3f6;color:#626975}.done .status{background:#eaf6f1;color:var(--green)}.danger{border:0;background:var(--red);color:white;font-weight:800}.note{margin-top:10px}.note label{font-size:12px;font-weight:800;color:#626975;display:block;margin-bottom:5px}.note textarea{min-height:58px;resize:vertical}.doneat{font-size:12px;color:var(--green);font-weight:700;margin-top:7px}.empty{padding:24px;text-align:center;border:1px dashed #cfd4dc;border-radius:14px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.log{display:grid;gap:8px}.logi{border:1px solid var(--line);border-radius:12px;padding:12px}.logi b{display:block}.logi .n{font-size:13px;color:#555;margin-top:5px}.months{display:grid;grid-template-columns:1fr 1fr;gap:9px}.month{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.month b{font-size:21px;display:block;margin-top:4px}.projectstep{border:1px solid var(--line);border-radius:13px;padding:12px}.projectstep .row2{display:flex;justify-content:space-between;gap:8px}.projectstep textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px}.projbtns{display:flex;gap:8px}.projbtns button{min-height:44px;border-radius:11px;font-weight:800}.projbtns .danger{flex:1}.projbtns .primary{flex:1}nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--dark);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.18)}nav button{border:0;background:transparent;color:#aeb4bd;padding:10px 2px;font-size:12px;font-weight:700}nav button.active{color:#fff;background:#282b31;border-radius:10px}@media(min-width:700px){body{padding-bottom:0}header{position:relative}.wrap{padding:22px}nav{position:sticky;top:0;bottom:auto;max-width:760px;margin:auto;border-radius:0 0 14px 14px}.months{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="brand">민화이팅 일정 다이어리</div><div class="tag">계획보다 실행 기록</div></header><main class="wrap"><section id="today" class="view active"><div class="top"><div><h1>오늘의 일정</h1><div class="sub">체크보다 중요한 건 실제로 뭘 했는지 남기는 겁니다.</div></div><div class="date" id="date"></div></div><div class="card"><div class="eyebrow">빠른 추가</div><div class="quick"><input id="quick" placeholder="예: 상품 후보 3개 조사"><button id="addBtn">일정 추가</button></div></div><div class="card"><div class="eyebrow">오늘 완료율</div><div class="score"><span id="score">0</span>%</div><div class="barw"><div class="bar" id="bar"></div></div><div class="sub" id="scoreText"></div></div><div class="card"><div id="taskList" class="tasks"></div></div></section><section id="week" class="view"><div class="top"><div><h1>7일 프로젝트</h1><div class="sub">한 주 동안 단계별 실행 내용을 기록합니다.</div></div></div><div class="card"><div class="projbtns"><button class="danger" id="delProject">프로젝트 삭제</button><button class="primary" id="newProject">새 프로젝트</button></div></div><div class="card"><h3 id="pTitle">프로젝트 없음</h3><div class="sub" id="pGoal">새 프로젝트를 만들어보세요.</div><div id="pSteps" class="tasks" style="margin-top:12px"></div></div></section><section id="month" class="view"><div class="top"><div><h1>월간 기록</h1><div class="sub">이번 달에 실제로 무엇을 했는지 확인합니다.</div></div></div><div class="stats"><div class="stat">완료<b id="mDone">0</b></div><div class="stat">실행메모<b id="mNotes">0</b></div><div class="stat">프로젝트<b id="mProjects">0</b></div><div class="stat">실행일<b id="mDays">0</b></div></div><div class="card"><div id="monthLog" class="log"></div></div></section><section id="year" class="view"><div class="top"><div><h1>연간 기록</h1><div class="sub">월별 실행량을 자동 누적합니다.</div></div></div><div class="card"><div id="months" class="months"></div></div></section><section id="record" class="view"><div class="top"><div><h1>전체 기록</h1><div class="sub">완료한 일정과 실행 메모를 모아봅니다.</div></div></div><div class="card"><div id="allLog" class="log"></div></div></section></main><nav><button class="active" data-v="today">오늘</button><button data-v="week">이번 주</button><button data-v="month">월간</button><button data-v="year">연간</button><button data-v="record">기록</button></nav><script>const KEY='minfighting_diary_v1';const isoDay=()=>new Date().toLocaleDateString('sv-SE');let mem={tasks:[],project:null};function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||mem}catch(e){return mem}}let s=load();function save(){mem=s;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}render()}const $=id=>document.getElementById(id);$('date').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.v).classList.add('active');render()}));function addTask(){const el=$('quick'),t=el.value.trim();if(!t)return;s.tasks.unshift({id:Date.now(),title:t,note:'',done:false,created:isoDay(),completedAt:null});el.value='';save()}$('addBtn').addEventListener('click',addTask);$('quick').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});function toggleTask(id){const t=s.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;save()}function deleteTask(id){const i=s.tasks.findIndex(x=>x.id===id);if(i<0)return;if(confirm('이 일정을 완전히 삭제할까요?')){s.tasks.splice(i,1);save()}}function noteTask(id,v){const t=s.tasks.find(x=>x.id===id);if(t){t.note=v;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}}function fmt(v){return v?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}function taskHTML(t){return `<div class="task ${t.done?'done':''}"><div class="row"><button class="check" data-act="toggle" data-id="${t.id}">${t.done?'✓':''}</button><div><div class="title">${esc(t.title)}</div><div class="meta">${t.done?'완료됨 · 다시 누르면 취소':'진행 중'}</div></div></div><div class="actions"><span class="status">${t.done?'완료':'진행'}</span><button class="danger" data-act="delete" data-id="${t.id}">삭제</button></div><div class="note"><label>실제로 한 내용</label><textarea data-note="${t.id}" placeholder="예: 도매사이트 4곳 비교, 후보 3개 추림">${esc(t.note||'')}</textarea></div>${t.done?`<div class="doneat">완료 ${fmt(t.completedAt)}</div>`:''}</div>`}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=Number(b.dataset.id);if(b.dataset.act==='toggle')toggleTask(id);if(b.dataset.act==='delete')deleteTask(id);if(b.dataset.act==='ptoggle')toggleStep(id);if(b.dataset.act==='pdelete')deleteStep(id)});document.addEventListener('input',e=>{if(e.target.matches('[data-note]'))noteTask(Number(e.target.dataset.note),e.target.value);if(e.target.matches('[data-pnote]'))noteStep(Number(e.target.dataset.pnote),e.target.value)});$('newProject').addEventListener('click',()=>{const name=prompt('이번 주 프로젝트 이름');if(!name)return;const goal=prompt('이번 주 목표를 한 줄로 적어주세요')||'';const raw=prompt('단계를 쉼표로 구분해서 적어주세요','자료 찾기,첫 결과 만들기,검토하기,수정하기,마무리')||'첫 단계 시작,중간 결과 만들기,마무리';s.project={title:name,goal,created:isoDay(),steps:raw.split(',').map((x,i)=>({id:Date.now()+i,title:x.trim(),note:'',done:false,completedAt:null})).filter(x=>x.title)};save()});$('delProject').addEventListener('click',()=>{if(!s.project){alert('삭제할 프로젝트가 없습니다.');return}if(confirm('현재 프로젝트를 완전히 삭제할까요?')){s.project=null;save()}});function toggleStep(id){if(!s.project)return;const x=s.project.steps.find(v=>v.id===id);if(!x)return;x.done=!x.done;x.completedAt=x.done?new Date().toISOString():null;save()}function deleteStep(id){if(!s.project)return;const i=s.project.steps.findIndex(v=>v.id===id);if(i<0)return;if(confirm('이 단계를 삭제할까요?')){s.project.steps.splice(i,1);save()}}function noteStep(id,v){if(!s.project)return;const x=s.project.steps.find(z=>z.id===id);if(x){x.note=v;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}}function render(){const td=s.tasks.filter(t=>t.created===isoDay()).slice(0,3);$('taskList').innerHTML=td.length?td.map(taskHTML).join(''):'<div class="empty">아직 일정이 없습니다. 위에서 하나 추가해보세요.</div>';const done=td.filter(x=>x.done).length,p=td.length?Math.round(done/td.length*100):0;$('score').textContent=p;$('bar').style.width=p+'%';$('scoreText').textContent=`${done}개 완료 / ${td.length}개`;$('pTitle').textContent=s.project?s.project.title:'프로젝트 없음';$('pGoal').textContent=s.project?s.project.goal:'새 프로젝트를 만들어보세요.';$('pSteps').innerHTML=s.project?s.project.steps.map(x=>`<div class="projectstep ${x.done?'done':''}"><div class="row2"><b>${esc(x.title)}</b><div><button class="check" data-act="ptoggle" data-id="${x.id}">${x.done?'✓':''}</button> <button class="danger" data-act="pdelete" data-id="${x.id}">삭제</button></div></div><textarea data-pnote="${x.id}" placeholder="이 단계에서 실제로 한 내용">${esc(x.note||'')}</textarea>${x.done?`<div class="doneat">완료 ${fmt(x.completedAt)}</div>`:''}</div>`).join(''):'<div class="empty">프로젝트가 없습니다.</div>';const ym=isoDay().slice(0,7),a=s.tasks.filter(t=>t.done&&t.completedAt&&t.completedAt.slice(0,7)===ym),b=s.project?s.project.steps.filter(x=>x.done&&x.completedAt&&x.completedAt.slice(0,7)===ym):[],logs=[...a.map(x=>({title:x.title,note:x.note,time:x.completedAt,type:'일정'})),...b.map(x=>({title:x.title,note:x.note,time:x.completedAt,type:s.project.title}))].sort((x,y)=>y.time.localeCompare(x.time));$('mDone').textContent=logs.length;$('mNotes').textContent=logs.filter(x=>x.note.trim()).length;$('mProjects').textContent=s.project&&s.project.created.slice(0,7)===ym?1:0;$('mDays').textContent=new Set(logs.map(x=>x.time.slice(0,10))).size;const logHtml=logs.length?logs.map(x=>`<div class="logi"><span class="status">${esc(x.type)}</span><b>${esc(x.title)}</b><div class="n">${x.note?esc(x.note):'실행 메모 없음'}</div><div class="meta">${fmt(x.time)}</div></div>`).join(''):'<div class="empty">완료 기록이 없습니다.</div>';$('monthLog').innerHTML=logHtml;$('allLog').innerHTML=logHtml;const y=new Date().getFullYear();$('months').innerHTML='';for(let m=1;m<=12;m++){const pre=`${y}-${String(m).padStart(2,'0')}`;const c=s.tasks.filter(t=>t.done&&t.completedAt&&t.completedAt.startsWith(pre)).length+(s.project?s.project.steps.filter(x=>x.done&&x.completedAt&&x.completedAt.startsWith(pre)).length:0);$('months').innerHTML+=`<div class="month">${m}월<b>${c}</b><span class="sub">완료</span></div>`}}render();</script></body></html>
