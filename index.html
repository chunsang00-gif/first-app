<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>나를 읽는 두 가지 언어</title><style>:root{--bg:#f6f5f2;--card:#fff;--ink:#16181d;--muted:#70757f;--line:#e8e5df;--accent:#26354a;--soft:#eef1f4;--gold:#9a7840}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh}.top{padding:22px 18px 12px;position:sticky;top:0;background:rgba(246,245,242,.94);backdrop-filter:blur(12px);z-index:4}.brand{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--gold)}.progress{height:4px;background:#e4e1db;border-radius:99px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:20%;transition:.25s}.screen{display:none;padding:18px}.screen.active{display:block}.eyebrow{font-size:12px;color:var(--gold);font-weight:900;letter-spacing:.08em}.title{font-size:29px;line-height:1.22;margin:8px 0 9px;letter-spacing:-.04em}.desc{color:var(--muted);line-height:1.65;font-size:14px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:12px;box-shadow:0 8px 30px rgba(20,25,32,.035)}label{display:block;font-size:13px;font-weight:850;margin:0 0 7px}.field{margin-bottom:15px}.field:last-child{margin-bottom:0}input,select{width:100%;border:1px solid #dcd9d3;border-radius:13px;background:#fbfbfa;padding:13px 12px;font-size:16px;color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #dcd9d3;background:#fff;border-radius:999px;padding:10px 13px;font-weight:800;color:#555}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}.actions{display:flex;gap:9px;padding:10px 18px 26px}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:900;font-size:15px}.btn.primary{background:var(--accent);color:#fff;flex:1}.btn.ghost{background:#e9e7e2;color:#555}.summary{display:grid;gap:8px}.sumrow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.sumrow:last-child{border-bottom:0}.sumrow span{color:var(--muted)}.report{padding-bottom:60px}.report-head{padding:18px 18px 8px}.report-head h1{font-size:30px;line-height:1.25;margin:8px 0}.meta{font-size:13px;color:var(--muted);line-height:1.7}.section{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:27px 19px;margin-top:10px}.num{font-size:12px;color:var(--gold);font-weight:900;letter-spacing:.1em}.section h2{font-size:23px;line-height:1.35;margin:7px 0 18px;letter-spacing:-.035em}.section h3{font-size:17px;margin:24px 0 10px}.section p{font-size:15.5px;line-height:1.85;margin:0 0 14px;color:#2d3036}.verdict{margin:22px 0 4px;padding:18px;border-radius:16px;background:#f1f2f4;border-left:4px solid var(--accent)}.verdict b{display:block;font-size:12px;color:var(--gold);margin-bottom:8px}.verdict p{font-weight:850;font-size:17px;line-height:1.65;margin:0;color:#171a20}.quote{font-weight:900!important;font-size:19px!important;line-height:1.7!important;letter-spacing:-.02em}.notice{font-size:12px!important;color:var(--muted)!important}.hidden{display:none!important}@media(min-width:740px){.app{padding-bottom:30px}.section{border:1px solid var(--line);border-radius:22px}.top{border-radius:0 0 18px 18px}}</style></head><body><div class="app"><header class="top" id="top"><div class="brand">SAJU × MBTI</div><div class="progress"><i id="bar"></i></div></header>
<section class="screen active" data-step="1"><div class="eyebrow">STEP 01</div><h1 class="title">태어난 정보를 알려주세요</h1><p class="desc">사주는 날짜뿐 아니라 출생 시간과 지역까지 함께 계산합니다.</p><div class="card"><div class="field"><label>성별</label><div class="chips" data-choice="gender"><button class="chip on" data-v="남성">남성</button><button class="chip" data-v="여성">여성</button></div></div><div class="field"><label>달력</label><div class="chips" data-choice="calendar"><button class="chip on" data-v="양력">양력</button><button class="chip" data-v="음력">음력</button></div></div><div class="field"><label>생년월일</label><input id="birth" type="date" value="1983-01-07"></div><div class="row"><div class="field"><label>출생시간</label><input id="time" type="time" value="14:20"></div><div class="field"><label>출생도시</label><input id="city" value="대구" placeholder="예: 대구"></div></div></div></section>
<section class="screen" data-step="2"><div class="eyebrow">STEP 02</div><h1 class="title">이름을 입력해주세요</h1><p class="desc">현재 이름을 중심으로 보고, 개명한 경우 이전 이름은 비교 자료로 사용합니다.</p><div class="card"><div class="field"><label>현재 이름</label><input id="name" value="박준민"></div><div class="field"><label>현재 이름 한자</label><input id="hanja" value="朴峻慜"></div><div class="field"><label>개명 여부</label><div class="chips" data-choice="renamed"><button class="chip on" data-v="예">예</button><button class="chip" data-v="아니오">아니오</button></div></div><div id="oldFields"><div class="row"><div class="field"><label>이전 이름</label><input id="oldName" value="박창우"></div><div class="field"><label>이전 한자</label><input id="oldHanja" value="朴昶祐"></div></div><div class="field"><label>개명일</label><input id="renameDate" type="date" value="2010-01-08"></div></div></div></section>
<section class="screen" data-step="3"><div class="eyebrow">STEP 03</div><h1 class="title">MBTI를 선택해주세요</h1><p class="desc">사주에 MBTI를 덧붙이는 것이 아니라, 두 분석이 겹치거나 엇갈리는 지점을 함께 봅니다.</p><div class="card"><div class="field"><label>MBTI</label><select id="mbti"><option>ISFP</option><option>INFP</option><option>ISTP</option><option>INTP</option><option>ISFJ</option><option>INFJ</option><option>ISTJ</option><option>INTJ</option><option>ESFP</option><option>ENFP</option><option>ESTP</option><option>ENTP</option><option>ESFJ</option><option>ENFJ</option><option>ESTJ</option><option>ENTJ</option><option>모름</option></select></div></div></section>
<section class="screen" data-step="4"><div class="eyebrow">STEP 04</div><h1 class="title">입력 정보를 확인해주세요</h1><p class="desc">확인 후 바로 분석 결과로 이동합니다.</p><div class="card summary" id="summary"></div></section>
<section class="screen report" data-step="5"><div class="report-head"><div class="eyebrow">PERSONAL REPORT</div><h1 id="reportTitle">박준민님의<br>사주 × MBTI 분석</h1><div class="meta" id="reportMeta"></div></div><article id="reportBody"></article></section>
<div class="actions" id="actions"><button class="btn ghost hidden" id="prev">이전</button><button class="btn primary" id="next">다음</button></div></div>
<script>(()=>{let step=1;const state={gender:'남성',calendar:'양력',renamed:'예'};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];$$('[data-choice]').forEach(g=>g.addEventListener('click',e=>{if(!e.target.classList.contains('chip'))return;e.preventDefault();g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');state[g.dataset.choice]=e.target.dataset.v;if(g.dataset.choice==='renamed')$('#oldFields').classList.toggle('hidden',state.renamed==='아니오')}));function val(id){return document.getElementById(id)?.value||''}function collect(){return {...state,birth:val('birth'),time:val('time'),city:val('city'),name:val('name'),hanja:val('hanja'),oldName:val('oldName'),oldHanja:val('oldHanja'),renameDate:val('renameDate'),mbti:val('mbti')}}function render(){$$('.screen').forEach(x=>x.classList.toggle('active',+x.dataset.step===step));$('#bar').style.width=(step*20)+'%';$('#prev').classList.toggle('hidden',step===1||step===5);$('#actions').classList.toggle('hidden',step===5);if(step===4)summary();if(step===5)report();scrollTo({top:0,behavior:'smooth'})}function summary(){const d=collect();$('#summary').innerHTML=[['성별',d.gender],['출생',`${d.calendar} ${d.birth} ${d.time||'시간 모름'}`],['출생도시',d.city],['현재 이름',`${d.name} ${d.hanja}`],['개명',d.renamed==='예'?`${d.oldName} ${d.oldHanja} → ${d.name}`:'아니오'],['MBTI',d.mbti]].map(x=>`<div class="sumrow"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}function section(n,t,body,verdict){return `<section class="section"><div class="num">${String(n).padStart(2,'0')}</div><h2>${t}</h2>${body}${verdict?`<div class="verdict"><b>핵심 판정</b><p>${verdict}</p></div>`:''}</section>`}function report(){const d=collect();$('#reportTitle').innerHTML=`${d.name||'당신'}님의<br>사주 × MBTI 분석`;$('#reportMeta').innerHTML=`${d.birth} · ${d.time||'출생시간 모름'} · ${d.city}<br>MBTI ${d.mbti}`;const sample=d.birth==='1983-01-07'&&d.time==='14:20'&&d.mbti==='ISFP';let h='';if(sample){h+=section(1,'먼저, 사주 자체부터 봅니다.',`<p>분석 기준 명식은 <strong>壬戌(임술) · 癸丑(계축) · 乙未(을미) · 癸未(계미)</strong>입니다. 중심은 乙木(을목: 주변 환경을 이용하며 유연하게 성장하는 나무의 기운)입니다.</p><p>이 명식은 위쪽에서 이해와 정보 수용의 힘이 강하게 드러나고, 아래쪽에서는 돈·생활·관리·책임처럼 현실에서 성립하는 조건이 무겁게 자리합니다. 그래서 단순히 생각이 많은 것이 아니라, 이해한 내용이 실제 생활에서도 맞아야 판단이 끝나는 쪽에 가깝습니다.</p><p>또 두 未土(미토) 안에는 자신과 같은 乙木(을목)이 있어 뿌리가 있고, 戌土(술토)와 未土(미토) 내부에는 丁火(정화: 능력과 경험을 밖으로 생산하는 작용)가 숨어 있습니다. 처음부터 행동력이 크게 보이기보다 실제 상황에 들어간 뒤 자기 힘이 나타날 수 있다는 차이가 생깁니다.</p><p>月支(월지: 사회생활과 생활기반을 보는 자리)의 丑土와 日支(일지: 가까운 생활과 배우자 영역을 함께 보는 자리)의 未土는 丑未冲(축미충: 서로 다른 현실 조건 사이에 조정이 필요한 관계)을 이룹니다. 하나의 선택이 시간·돈·책임·생활 같은 다른 조건까지 움직일 수 있다는 점을 함께 봐야 합니다.</p>`,`<strong>${d.name}</strong>님의 사주는 단순히 ‘생각이 많은 사주’가 아니라 <strong>‘쉽게 확정하지 않는 사주’</strong>에 가깝습니다. 강점은 받아들인 것을 자기 판단으로 다시 만드는 힘이고, 가장 조심할 순간은 오히려 “이 정도면 충분히 안다”고 느끼기 시작한 이후일 수 있습니다.`);h+=section(2,`${d.mbti}를 겹치면 예상 밖의 모순이 나타납니다.`,`<p>사주만 보면 충분히 이해하고 확신이 생긴 다음 움직이는 모습이 먼저 보입니다. 그런데 ISFP의 직접 경험형 판단을 함께 보면, 생각만으로는 끝나지 않는 문제가 생깁니다.</p><p>가격·조건·위험은 조사할 수 있지만 “내가 실제로 좋아하는가”, “계속할 수 있는가”, “내 방식으로 할 수 있는가”는 직접 경험해야 마지막 정보가 들어옵니다.</p>`,`<strong>확신이 생겨야 움직이는 사람처럼 보이지만, 실제로는 움직여야 확신이 완성되는 사람</strong>일 가능성이 높습니다.`);h+=section(3,'결정이 느릴 때와 빠를 때가 갈리는 이유',`<p>정보를 받아들이는 문은 넓지만 최종 승인권은 자기 안에 있습니다. 자기 기준이 아직 없는 문제에서는 오래 볼 수 있지만, 경험이 충분해 기준이 만들어진 분야에서는 판단이 매우 빨라질 수 있습니다.</p><p>여기서 놓치기 쉬운 부분은 정보가 충분해진 뒤에도 계속 검색하는 것입니다. 어느 순간부터는 판단을 위한 정보가 아니라 원하는 결론을 확인하기 위한 정보가 될 수 있습니다.</p>`,`결정을 못 내리는 것이 아니라, <strong>결정에 필요한 증거가 이미 충분한데도 확신을 더 얻으려고 할 때</strong> 문제가 생길 수 있습니다.`);h+=section(4,'돈에서는 금액보다 통제 가능성이 중요합니다.',`<p>수입이 늘어나는 선택은 시간·선투입 비용·최대 손실·관리 부담까지 한 묶음으로 봐야 합니다. 특히 마음이 붙은 다음 계산하면 철수 기준도 같이 느슨해질 수 있습니다.</p><p>따라서 돈이 들어가는 선택에서는 최대 손실, 기다릴 기간, 중단 조건을 먼저 정해두는 방식이 유리합니다.</p>`,`경계해야 할 것은 못 버는 돈만이 아닙니다. <strong>돈은 들어오는데 그 돈 때문에 시간·책임·관리 부담이 더 빠르게 늘어나는 선택</strong>을 더 주의해서 봐야 합니다.`);h+=section(5,'일에서는 경력이 무엇으로 바뀌는지가 중요합니다.',`<p>시간이 지나면서 단순히 익숙해지는지, 아니면 문제를 발견하고 더 어려운 판단을 맡게 되는지를 구분해야 합니다. 경험이 쌓일수록 판단권·전문성·책임의 범위가 넓어지는 환경이라면 경력이 자산으로 바뀝니다.</p><p>반대로 경험이 많아질수록 “해봐서 안다”가 새로운 조건까지 대신 판단하는 위험도 생깁니다.</p>`,`좋은 경력은 오래 버틴 경력이 아니라 <strong>시간이 갈수록 남들이 맡기 어려운 판단을 내가 맡게 되는 경력</strong>입니다.`);h+=section(6,'관계에서는 말의 양보다 시점이 중요합니다.',`<p>불편함이 생겼을 때 바로 결론을 내리기보다 내부에서 이유를 생각하고 더 지켜볼 수 있습니다. 문제는 상대에게 이 판단 과정이 보이지 않을 수 있다는 점입니다.</p><p>그래서 본인에게는 오래 누적된 문제인데 상대에게는 오늘 처음 심각하게 들은 문제가 될 수 있습니다.</p>`,`관계에서 가장 조심해야 할 것은 감정을 숨기는 것 자체가 아니라, <strong>상대가 문제의 심각성을 알았을 때는 이미 내 마음속 판단이 너무 많이 진행되어 있을 수 있다는 점</strong>입니다.`);h+=section(7,'스트레스가 커지면 판단 방식이 달라질 수 있습니다.',`<p>평소에는 이유와 상황을 살펴보다가 현실 부담이 누적되면 “그래서 결론이 뭔데?”, “언제까지 해야 하는데?”처럼 결과 중심으로 급격히 기울 수 있습니다.</p>`,`과부하의 위험 신호는 생각이 많아지는 것보다 오히려 <strong>더 이상 생각하고 싶지 않아지는 것</strong>일 수 있습니다.`);h+=section(8,'2027년 丁未 — 밖에서 확인하는 시기',`<p>2027년 丁未(정미)의 丁火(정화)는 원국 안에 숨어 있던 생산·표현의 작용을 겉으로 드러냅니다. 생각하거나 경험으로만 가지고 있던 것을 실제 형태로 꺼냈을 때 외부에서도 통하는지 확인하는 문제가 중요해질 수 있습니다.</p><p>다만 未土(미토)가 기존의 丑未冲(축미충)을 다시 강조하므로 실행과 함께 시간·돈·책임·기존 생활의 조정 문제도 더 선명해질 수 있습니다.</p>`,`2027년의 승부는 기회를 많이 잡는 것이 아니라 <strong>‘나에게만 가치 있는 것’과 ‘밖에서도 가치가 인정되는 것’을 구분해내는 것</strong>에 가깝습니다.`);h+=section(9,'최종 판정',`<p>이 분석에서 반복되는 핵심은 더 많이 배우거나 무조건 과감해지는 것이 아닙니다. 사실은 조사하고, 가치는 자기 기준으로 보고, 적성과 만족은 경험하고, 돈·시간·위험은 숫자로 확인해야 합니다.</p><p>이 구분이 잘되면 신중함은 정확성이 되고, 경험은 전문성이 되며, 자기 기준은 고집이 아니라 판단력이 됩니다.</p><p>2027년에는 특히 더 준비하는 것보다 이미 준비된 것 중 무엇이 실제 세상에서도 통하는지를 확인하는 과정이 중요해질 수 있습니다.</p><p class="quote">“나는 아직 몰라서 못 움직이는 것인가,<br>아니면 움직여보지 않았기 때문에 아직 모르는 것인가?”</p>`,null)}else{h+=section(1,'분석 엔진 연결 준비 완료',`<p>입력 화면과 리포트 구조는 완성되었습니다. 현재 이 프로토타입에는 승인된 기준 샘플의 분석 결과가 연결되어 있습니다.</p><p>다음 제작 단계에서 만세력 계산 엔진과 AI 해석 엔진을 연결하면 다른 생년월일·MBTI에서도 같은 구조와 품질 기준으로 결과가 생성됩니다.</p>`,null)}h+=`<section class="section"><p class="notice">사주는 전통적 상징 해석 체계이며 MBTI는 성격 선호를 설명하는 도구입니다. 결과는 과학적 인과관계나 미래 사건의 확정적 예측을 의미하지 않습니다.</p></section>`;$('#reportBody').innerHTML=h}$('#next').onclick=()=>{if(step<5){step++;render()}};$('#prev').onclick=()=>{if(step>1){step--;render()}};render()})();</script></body></html>
