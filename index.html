<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 실행 대시보드</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f7f7f7;font-family:Arial,'Noto Sans KR',sans-serif}button,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}.top h1{font-size:34px;margin:0 0 8px}.muted{color:#9ca3af}.badge{background:#1f2937;padding:8px 12px;border-radius:999px;font-size:13px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#171a21;border:1px solid #2a2f3a;border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.18)}.card h2{margin:0 0 16px;font-size:20px}.inputrow{display:flex;gap:10px}.inputrow input{flex:1;background:#0f1115;border:1px solid #343a46;color:white;border-radius:12px;padding:14px}.primary{background:#fff;color:#111;border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer}.secondary{background:#242936;color:white;border:1px solid #3a4251;border-radius:10px;padding:9px 12px;cursor:pointer}.idea{margin-top:16px;padding:16px;border-radius:14px;background:#11141a;border:1px solid #242a35}.idea-title{font-size:18px;font-weight:700}.tasks{margin-top:14px;display:grid;gap:9px}.task{display:flex;align-items:center;gap:10px;background:#11141a;border:1px solid #262c36;border-radius:12px;padding:11px}.task input{width:18px;height:18px}.task.done span{text-decoration:line-through;color:#777}.progress{height:10px;background:#2a2f38;border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#fff;transition:.25s}.score{font-size:42px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:#11141a;border:1px solid #262c36;border-radius:14px;padding:14px}.kpi b{display:block;font-size:24px;margin-top:4px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{min-height:76px;text-align:left}.history{display:grid;gap:9px;max-height:220px;overflow:auto}.hist{padding:10px 12px;background:#11141a;border-radius:10px;border:1px solid #262c36;font-size:14px}.footer{margin-top:18px;color:#6b7280;font-size:12px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:1fr 1fr 1fr}.inputrow{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="muted">개인 실행 시스템</div><h1>AI 실행 대시보드</h1><div class="muted">생각만 하지 말고, 바로 다음 행동으로 바꿉니다.</div></div>
    <div class="badge" id="today"></div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>1. 아이디어 하나만 적기</h2>
      <div class="inputrow">
        <input id="ideaInput" placeholder="예: 스마트스토어 작업복 상품 테스트">
        <button class="primary" onclick="analyzeIdea()">실행계획 만들기</button>
      </div>
      <div id="planArea" class="idea" style="display:none">
        <div class="muted">현재 프로젝트</div>
        <div class="idea-title" id="ideaTitle"></div>
        <div class="tasks" id="tasks"></div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="muted" style="margin-top:8px" id="progressText"></div>
      </div>
    </section>

    <section class="card">
      <h2>오늘의 실행 점수</h2>
      <div class="score"><span id="score">0</span>%</div>
      <div class="muted">체크한 일 기준 자동 계산</div>
      <div class="kpis" style="margin-top:18px">
        <div class="kpi"><span class="muted">전체</span><b id="totalCount">0</b></div>
        <div class="kpi"><span class="muted">완료</span><b id="doneCount">0</b></div>
        <div class="kpi"><span class="muted">남음</span><b id="leftCount">0</b></div>
      </div>
    </section>

    <section class="card">
      <h2>2. 빠른 시작</h2>
      <div class="quick">
        <button class="secondary" onclick="preset('취업 준비')">💼 취업 준비<br><span class="muted">지원·면접·연봉</span></button>
        <button class="secondary" onclick="preset('스마트스토어 상품 테스트')">🛒 스마트스토어<br><span class="muted">상품조사·등록·검증</span></button>
        <button class="secondary" onclick="preset('앱 아이디어 만들기')">📱 앱 만들기<br><span class="muted">기획·화면·테스트</span></button>
        <button class="secondary" onclick="preset('개인 수익화 프로젝트')">💰 수익화<br><span class="muted">아이디어·실행·검증</span></button>
      </div>
    </section>

    <section class="card">
      <h2>최근 프로젝트</h2>
      <div id="history" class="history"><div class="muted">아직 기록이 없습니다.</div></div>
    </section>
  </div>
  <div class="footer">입력한 내용과 체크 상태는 이 브라우저에 자동 저장됩니다.</div>
</div>

<script>
const templates={
 '취업 준비':['공고 3개 추려보기','내 경력과 맞는 공고 1개 선택','이력서 핵심 문장 3개 수정','지원하기','면접 예상질문 5개 준비'],
 '스마트스토어 상품 테스트':['후보 상품 10개 수집','가격·리뷰·경쟁강도 비교','상위 3개 압축','도매가와 예상마진 계산','1개 상품 등록 테스트'],
 '앱 아이디어 만들기':['문제 한 줄 정의','핵심 기능 3개 선정','첫 화면 구성','동작하는 시제품 만들기','직접 써보고 불편한 점 3개 수정'],
 '개인 수익화 프로젝트':['돈 내는 사람이 누구인지 정의','판매할 것 1개 정하기','첫 결과물 만들기','무료로 3명에게 보여주기','반응 좋은 부분만 개선']
};
let state=JSON.parse(localStorage.getItem('aiDash')||'null')||{idea:'',tasks:[],history:[]};
document.getElementById('today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

function preset(name){document.getElementById('ideaInput').value=name;analyzeIdea()}
function analyzeIdea(){
 const input=document.getElementById('ideaInput').value.trim(); if(!input)return;
 let key=Object.keys(templates).find(k=>input.includes(k.split(' ')[0]));
 let list=key?templates[key]:['목표를 한 문장으로 정리','필요한 정보 3개 찾기','가장 작은 실행 1개 하기','결과 확인','다음 행동 결정'];
 state.idea=input; state.tasks=list.map(t=>({text:t,done:false}));
 state.history=[{title:input,time:new Date().toLocaleString('ko-KR')},...state.history.filter(x=>x.title!==input)].slice(0,8);
 save();render();
}
function toggle(i){state.tasks[i].done=!state.tasks[i].done;save();render()}
function save(){localStorage.setItem('aiDash',JSON.stringify(state))}
function render(){
 if(state.idea){document.getElementById('planArea').style.display='block';document.getElementById('ideaTitle').textContent=state.idea}
 const box=document.getElementById('tasks');box.innerHTML='';
 state.tasks.forEach((t,i)=>{const d=document.createElement('div');d.className='task'+(t.done?' done':'');d.innerHTML=`<input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><span>${t.text}</span>`;box.appendChild(d)});
 const total=state.tasks.length,done=state.tasks.filter(t=>t.done).length,p=total?Math.round(done/total*100):0;
 document.getElementById('bar').style.width=p+'%';document.getElementById('progressText').textContent=`진행률 ${p}%`;
 document.getElementById('score').textContent=p;document.getElementById('totalCount').textContent=total;document.getElementById('doneCount').textContent=done;document.getElementById('leftCount').textContent=total-done;
 const h=document.getElementById('history');h.innerHTML=state.history.length?'': '<div class="muted">아직 기록이 없습니다.</div>';
 state.history.forEach(x=>{const d=document.createElement('div');d.className='hist';d.innerHTML=`<b>${x.title}</b><div class="muted">${x.time}</div>`;h.appendChild(d)});
}
render();
</script>
</body>
</html>
